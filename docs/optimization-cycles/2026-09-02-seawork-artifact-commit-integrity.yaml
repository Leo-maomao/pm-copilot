fixes:
  - path: "scripts/run_interactive_request.py"
    change: "Record source digest before each isolated Agent call, require a changed staged target for promotion, and restore real delivery bytes written outside the isolated stage."
    rationale: "Stage review reads only bytes proven to originate from the current Agent invocation and expected workspace."
    fix_surface: "controller"
  - path: "scripts/test_run_interactive_request.py"
    change: "Cover idle without a stage write, stream-disconnected intermediate writes, and writes to the wrong workspace."
    rationale: "Prevent false promotion across timeout, reconnect, and path-confusion failures."
    fix_surface: "test"
