cycle_id: "2026-09-02-seawork-artifact-commit-integrity"
date: "2026-09-02"
goal: "Promote a Seawork artifact only when this Agent call changed the controller-owned isolated workspace."
practice_source:
  source_type: "user_feedback"
  source_run_id: "not_available"
  source_output_folder: ""
  user_corrections:
    - "An Agent idle state, completion message, or pre-existing target file is not proof that the controller stage workspace received this call's artifact."
  delivery_check_report: "The Trace Agent reported editing run-log.yaml, but the independent review read the old staged log after the controller marked it promoted."
observed_corrections:
  - correction: "Artifact attribution needs a call-local source digest, not only Agent provenance and target existence."
    affected_artifact: "Interactive delivery stage promotion"
    evidence: "The real delivery workspace retained stale content while an Agent completion was recorded."
    severity: "Critical"
generalized_failures:
  - failure_code: "agent_terminal_state_promotes_stale_or_wrong_workspace_artifact"
    generalized_symptom: "A detached Agent can become idle after writing elsewhere or not changing a copied stage target, while the controller promotes stale bytes."
    host_specific_details_removed: true
    reusable_rule: "Capture the isolated target digest before launch and promote only a nonempty changed target from that exact workspace; restore any non-promoted write to the real delivery workspace."
