fixes:
  - path: "scripts/model_catalog.py"
    change: "Discover models from ready Seawork providers and describe CLI defaults as degraded candidates until their response proves an actual model."
    rationale: "Model IDs and capability evidence remain device-sourced instead of repository-sourced."
    fix_surface: "runtime"
  - path: "scripts/agent_runtime.py"
    change: "Rank current-device candidates by declared capability and perform one traceable transport fallback."
    rationale: "A transport failure progresses to a distinct eligible route without unbounded retries."
    fix_surface: "runtime"
  - path: "scripts/test_model_catalog.py"
    change: "Cover device model discovery and authenticated default candidates."
    rationale: "Keep discovery semantics deterministic."
    fix_surface: "test"
