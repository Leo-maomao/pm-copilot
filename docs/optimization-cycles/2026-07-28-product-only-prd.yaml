cycle_id: "product-only-prd-2026-07-28"
date: "2026-07-28"
goal: "Make PM Copilot PRDs product-only documents and keep technical implementation content outside the PRD."
practice_source:
  source_type: "user_correction"
  source_run_id: ""
  source_output_folder: ""
  user_corrections:
    - "PRDs contain too much technical implementation content."
    - "A PRD is a product document and must not display technical implementation or technical solution content; a human can add it when necessary."
  delivery_check_report: ""
  artifacts_reviewed:
    - "artifacts/prd-contract.md"
    - "skills/prd-writing/SKILL.md"
    - "agents/requirements-agent.md"
    - "templates/prd-template.md"
    - "templates/implemented-feature-prd-template.md"
    - "scripts/validate_outputs.py"
observed_corrections:
  - correction: "Technical implementation maps, code evidence, and engineering handoff fields appeared in PRD guidance and templates."
    affected_artifact: "PRD contract, instructions, templates, and output validation"
    evidence: "The active Requirements Agent required an engineering implementation map, and implemented-feature PRDs required code and resource mapping sections."
    severity: "High"
generalized_failures:
  - failure_code: "technical_implementation_leak_in_prd"
    generalized_symptom: "A product requirement document can become an engineering design artifact when runtime rules and templates expose technical implementation evidence alongside product requirements."
    host_specific_details_removed: true
    reusable_rule: "Keep PRDs limited to product behavior, user experience, business rules, product evidence, risks, and acceptance results; record technical evidence only in run traces or separately requested engineering handoffs."
input_cases:
  - eval_case: "Chinese product-only PRD output"
    run_id: ""
    context_mode: "repo-backed"
    output_folder: ""
scenario_portfolio:
  context_mode: "repo-backed"
  product_type: "other"
  pm_task_type: "self_improvement"
  risk_profile: "operations"
  platform: "cross_platform"
  pm_user_maturity: "ai_product_manager"
artifact_expectations:
  prd: false
  ui_delivery: false
  tracking_plan: false
  dev_tasks: false
  launch_decision: false
  pre_clarification_only: false
generalization_boundary:
  reference_projects_are_fixtures: true
  host_specific_terms_allowed_only_in:
    - "outputs/<run-id>/"
    - "fixture-scoped eval case"
  host_specific_terms_must_not_enter:
    - "PM_COPILOT.md"
    - "workflow/"
    - "policies/"
    - "indexes/"
    - "agents/"
    - "skills/"
    - "templates/"
    - "tools/"
    - "artifacts/"
    - "guardrails/"
    - "docs/"
baseline:
  scorecard_report: "outputs/improvement-scorecard.json"
  validation_pass_rate: null
  high_severity_failures:
    - "technical_implementation_leak_in_prd"
results:
  generated_artifacts:
    - "docs/optimization-cycles/2026-07-28-product-only-prd.yaml"
  validation_commands:
    - "python3 scripts/test_prd_contract.py"
    - "python3 scripts/validate_runtime_routing.py"
    - "python3 scripts/validate_repo.py"
    - "git diff --check"
  validation_reports: []
  review_scores:
    delivery: null
    prd: null
    metrics_tracking: null
    ui_delivery: null
    delivery_review: null
failure_classification:
  - failure_code: "technical_implementation_leak_in_prd"
    severity: "High"
    area: "PRD product-document boundary"
    symptom: "The PRD runtime exposed technical implementation content instead of keeping it in a separate engineering handoff."
    evidence: "Active agent instructions and templates required implementation maps and evidence sections in the PRD."
    first_surface_to_fix: "artifact contract"
fixes:
  - path: "artifacts/prd-contract.md, skills/prd-writing/SKILL.md, agents/requirements-agent.md"
    change: "Made PRDs product-only and moved technical implementation evidence to run traces or explicitly requested engineering handoffs."
    rationale: "The canonical PRD instructions must set the boundary before any template or output is generated."
    fix_surface: "contract"
  - path: "templates/prd-template.md, templates/implemented-feature-prd-template.md, docs/implemented-feature-prd-workflow.md"
    change: "Removed technical fields and implementation-evidence sections from PRD templates and reconstruction workflow."
    rationale: "Templates must not reintroduce content prohibited by the canonical contract."
    fix_surface: "template"
  - path: "scripts/validate_outputs.py, scripts/test_prd_contract.py"
    change: "Rejected technical PRD sections and fields with deterministic regression cases."
    rationale: "Validation prevents future runtime edits from leaking technical content into PRDs."
    fix_surface: "validator"
regression_updates:
  evals_added_or_updated:
    - "scripts/test_prd_contract.py technical_section"
    - "scripts/test_prd_contract.py technical_field"
  validators_added_or_updated:
    - "scripts/validate_outputs.py"
versioning:
  previous_version: "4.2.0"
  new_version: "4.2.1"
  changelog_updated: true
sync:
  embedded_copies_checked: []
  embedded_copies_updated: []
  skipped_targets:
    - path: "embedded copies"
      reason: "No embedded-copy sync target was present in this repository workspace."
remote_push:
  required: false
  status: "not_requested"
  target: ""
