failure_classification:
  - failure_code: "implemented_prd_nonproduction_leak"
    severity: "High"
    area: "PRD reconstruction"
    symptom: "Development-only UI and descriptive text enter production requirements."
    evidence: "User correction"
    first_surface_to_fix: "contract"
  - failure_code: "requirement_overfragmentation"
    severity: "Medium"
    area: "PRD structure"
    symptom: "One dialog change becomes several requirement rows."
    evidence: "User correction"
    first_surface_to_fix: "contract"
  - failure_code: "i18n_list_join"
    severity: "Medium"
    area: "localization handoff"
    symptom: "Independent labels are joined with a slash in one copy unit."
    evidence: "User correction"
    first_surface_to_fix: "contract"
fixes:
  - path: "artifacts/prd-contract.md"
    change: "Added release-intent evidence classification, requirement-granularity, and smallest-localizable-copy-unit rules."
    rationale: "Keep the three decisions with the PRD artifact contract that owns their quality gates."
    fix_surface: "contract"
  - path: "skills/prd-writing/SKILL.md"
    change: "Applied contract boundaries before requirement drafting and localization extraction."
    rationale: "Make the writer execute the canonical contract rules."
    fix_surface: "skill"
  - path: "agents/requirements-agent.md"
    change: "Moved unresolved decisions, speculative content, clarification identifiers, and screenshot-placeholder explanations out of PRD content and into the run trace."
    rationale: "Keep alternative requirement-agent paths aligned with the PRD contract's confirmed-production and controlled-placeholder boundaries."
    fix_surface: "agent"
  - path: "PM_COPILOT.md, prompts/prompt-system.md, tools/validation-tooling.md"
    change: "Aligned active screenshot-placeholder guidance with the controlled `占位图：功能-状态.png` format."
    rationale: "Prevent runtime instructions from requesting PRD prose that the contract and validator reject."
    fix_surface: "runtime guidance"
  - path: "docs/implemented-feature-prd-workflow.md"
    change: "Applied the evidence boundary to implementation inspection, requirement construction, screenshots, and localization copy."
    rationale: "Prevent observed local states from being treated as release intent."
    fix_surface: "workflow"
  - path: "scripts/validate_outputs.py"
    change: "Rejected explicit non-production scaffolding without globally banning business use of demo."
    rationale: "Catch repeated textual leakage while leaving whether slash-bearing copy is a literal continuous source string to the PRD contract and generation evidence."
    fix_surface: "validator"
regression_updates:
