cycle_id: "2026-08-06-prd-production-intent-and-i18n-units"
date: "2026-08-06"
goal: "Keep PRD reconstruction aligned to release intent, coherent user outcomes, and atomic localization copy units."
practice_source:
  source_type: "support_feedback"
  source_run_id: "user-feedback-2026-08-06"
  source_output_folder: ""
  user_corrections:
    - "Local demo, self-test, and screenshot states must not become production PRD requirements."
    - "Related changes inside one dialog should remain one requirement when they serve one user outcome."
    - "Independent localization labels must be separate entries rather than slash-joined by module."
  delivery_check_report: ""
  artifacts_reviewed:
    - "artifacts/prd-contract.md"
    - "skills/prd-writing/SKILL.md"
    - "scripts/validate_outputs.py"
observed_corrections:
  - correction: "Separate observed implementation evidence from confirmed release intent before drafting an implemented-feature PRD."
    affected_artifact: "implemented-feature PRD"
    evidence: "User feedback identified local-only demo and screenshot states leaking into product requirements."
    severity: "High"
  - correction: "Group related dialog changes under a single user outcome instead of assigning one requirement per control or state."
    affected_artifact: "requirement list and detail"
    evidence: "User feedback identified over-fragmented dialog requirements."
    severity: "Medium"
  - correction: "Make independently localizable labels separate pure-text and mapping-table entries."
    affected_artifact: "localization handoff"
    evidence: "User feedback identified slash-joined labels from one module."
    severity: "Medium"
generalized_failures:
  - failure_code: "implemented_prd_nonproduction_leak"
    generalized_symptom: "Observed local presentation states are treated as production requirements without evidence of launch intent."
    host_specific_details_removed: true
    reusable_rule: "Implementation, screenshots, and test data establish candidate behavior only; development-only scaffolding stays out of the PRD."
  - failure_code: "requirement_overfragmentation"
    generalized_symptom: "Controls, copy, validation, and visual states are split into separate requirements despite one user outcome."
    host_specific_details_removed: true
    reusable_rule: "Requirement boundaries follow independently decided user outcomes, not individual UI elements or coverage states."
  - failure_code: "i18n_list_join"
    generalized_symptom: "Independent visible strings are merged into one localization row because they share a surface."
    host_specific_details_removed: true
    reusable_rule: "Each independently usable localizable string has one pure-text line and one mapping row."
input_cases:
  - eval_case: "implemented-feature PRD reconstruction"
    run_id: "user-feedback-2026-08-06"
    context_mode: "brief-only"
    output_folder: ""
