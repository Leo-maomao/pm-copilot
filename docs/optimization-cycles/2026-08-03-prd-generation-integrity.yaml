cycle_id: "2026-08-03-prd-generation-integrity"
date: "2026-08-03"
goal: "Restore evidence-first PRD generation by preventing stale artifact reuse and unreviewed omission."
practice_source:
  source_type: "user_feedback_and_run_audit"
  source_run_id: "canvas-media-editing-prd-v2-2026-07-31"
  source_output_folder: "pm-copilot-outputs/canvas-media-editing-prd-v2-2026-07-31"
  user_corrections:
    - "Fix why requirements are not followed instead of appending symptom-specific rules."
    - "Tracking remains judgment-based, but its omission must be a reviewed decision."
  delivery_check_report: "The run reused its own old PRD, trace, and evidence ledger while declaring an implemented-feature task inactive."
generalized_failures:
  - failure_code: "generated_artifact_context_leak"
    generalized_symptom: "A rewrite can treat prior generated artifacts as current facts and inherit stale decisions or tool results."
    host_specific_details_removed: true
    reusable_rule: "Generated artifacts are comparison-only inputs and every distinct generation uses a new run folder."
  - failure_code: "unreviewed_requirement_coverage_omission"
    generalized_symptom: "Optional PRD sections can disappear without a per-requirement decision about visual, copy, or measurement relevance."
    host_specific_details_removed: true
    reusable_rule: "Every requirement receives source-backed visual, localization, and tracking coverage decisions before delivery review."
input_cases:
  - eval_case: "implemented-feature-rewrite-isolation"
    run_id: "canvas-media-editing-prd-v2-2026-07-31"
    context_mode: "repo-backed"
    output_folder: ""
scenario_portfolio:
  context_mode: "repo-backed"
  product_type: "other"
  pm_task_type: "implemented_feature_prd"
  risk_profile: "normal"
  platform: "web"
  pm_user_maturity: "senior_pm"
artifact_expectations:
  prd: true
  ui_delivery: false
  tracking_plan: false
  dev_tasks: false
  launch_decision: false
  pre_clarification_only: false
generalization_boundary:
  reference_projects_are_fixtures: true
  host_specific_terms_allowed_only_in:
    - "outputs/<run-id>/"
    - "fixture-scoped eval case"
  host_specific_terms_must_not_enter:
    - "PM_COPILOT.md"
    - "README*.md"
    - "workflow/"
    - "prompts/"
    - "agents/"
    - "skills/"
    - "templates/"
    - "tools/"
    - "artifacts/"
    - "guardrails/"
    - "docs/"
    - "context/*.example.yaml"
baseline:
  scorecard_report: ""
  validation_pass_rate: null
  high_severity_failures:
    - "Stale output artifacts were loaded as current evidence."
    - "Visual, localization, and tracking omissions were not reviewed per requirement."
results:
  generated_artifacts: []
  validation_commands:
    - "python3 scripts/test_prd_contract.py"
    - "python3 scripts/test_prd_generation_integrity.py"
    - "python3 scripts/validate_runtime_routing.py"
    - "python3 scripts/validate_repo.py"
  validation_reports: []
  review_scores:
    delivery: null
    prd: null
    metrics_tracking: null
    ui_delivery: null
    delivery_review: null
failure_classification:
  - failure_code: "generated_artifact_context_leak"
    severity: "High"
    area: "context-loading"
    symptom: "A generated output folder becomes both comparison input and active delivery destination."
    evidence: "Run trace files_loaded and artifact reuse evidence"
    first_surface_to_fix: "workflow"
  - failure_code: "unreviewed_requirement_coverage_omission"
    severity: "High"
    area: "product-review"
    symptom: "A PRD omits tracking or visual states without an explicit decision."
    evidence: "Run trace and generated PRD"
    first_surface_to_fix: "contract"
fixes:
  - path: "workflow/context-loading.md"
    change: "Separate comparison artifacts from current product evidence and require fresh run folders."
    rationale: "Prevent stale generated content from steering current requirements."
    fix_surface: "workflow"
  - path: "artifacts/prd-contract.md"
    change: "Add generic per-requirement coverage review and visual recovery rules."
    rationale: "Turn omission into an explicit review decision rather than a default."
    fix_surface: "contract"
  - path: "scripts/validate_agent_trace.py"
    change: "Validate isolation, active route integrity, and coverage-review completeness."
    rationale: "Prevent a trace from bypassing the implemented-feature PRD route."
    fix_surface: "validator"
regression_updates:
  evals_added_or_updated: []
  validators_added_or_updated:
    - "scripts/test_prd_generation_integrity.py"
    - "scripts/test_prd_contract.py"
versioning:
  previous_version: "4.9.3"
  new_version: "4.9.4"
  changelog_updated: true
sync:
  embedded_copies_checked:
    - "Global runtime only; project-local embedded copies are not required."
  embedded_copies_updated: []
  skipped_targets:
    - path: "origin/main"
      reason: "Remote push is pending local validation and explicit release handoff."
after:
  scorecard_report: ""
  validation_pass_rate: null
  high_severity_failures: []
decision:
  status: "improved"
  next_action: "Validate the new run in a fresh output folder before accepting any rewritten PRD."
