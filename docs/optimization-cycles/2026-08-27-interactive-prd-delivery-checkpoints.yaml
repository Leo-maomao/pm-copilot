  - "scripts/test_pm_copilot_mcp.py"
canonical_rule:
  owner: "PM_COPILOT.md / Production Conversation Boundary"
  rule: >-
    Confirmed delivery must persist an atomic checkpoint before and after every
    externally executed stage; interrupted delivery must never be represented
    as awaiting human confirmation.
