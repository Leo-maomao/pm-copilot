source_run: >-
  SeaArt interactive PRD run in
  pm-copilot-outputs/video-super-resolution-and-layer-separation-2026-08-27.
generalized_failure: >-
  The controller promoted staged artifacts and performed stage reviews in
  memory, but wrote interactive-run.json only after the whole delivery flow
  returned. An interruption could therefore leave a real artifact and staging
  trace while canonical state incorrectly remained awaiting_confirmation.
