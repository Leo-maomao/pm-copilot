cycle_id: "user-driven-prd-template-2026-07-28"
date: "2026-07-28"
goal: "Standardize PRDs around user-driven requirement lists and matching requirement details."
practice_source:
  source_type: "user_correction"
  source_run_id: "team-projects-prd-2026-07-28"
  source_output_folder: "outputs/team-projects-prd-2026-07-28"
  user_corrections:
    - "The existing PRD structure is still unsuitable."
    - "Requirement lists and requirement details are crucial and must be based on users; the document is currently too divergent."
    - "Use a standard structure with document information, version history, background, optional research, requirement list, requirement details, optional localization, and optional tracking."
  delivery_check_report: "team-projects-prd-2026-07-28/tool-results/delivery-check-report.json"
  artifacts_reviewed:
    - "artifacts/prd-contract.md"
    - "skills/prd-writing/SKILL.md"
    - "agents/requirements-agent.md"
    - "templates/prd-template.md"
    - "templates/implemented-feature-prd-template.md"
    - "scripts/validate_outputs.py"
observed_corrections:
  - correction: "The decision-first structure scattered users, requirements, risks, acceptance, and delivery information across many unrelated top-level sections."
    affected_artifact: "PRD information architecture and example output"
    evidence: "User review of the regenerated team-projects PRD found that the structure remained unsuitable and that requirements were not sufficiently grounded in users."
    severity: "High"
generalized_failures:
  - failure_code: "prd_requirements_not_user_traceable"
    generalized_symptom: "A PRD can become diffuse when requirement details are written before a user-driven requirement index and important user context is dispersed across decision, scope, risk, and acceptance sections."
    host_specific_details_removed: true
    reusable_rule: "Create a mandatory requirement list before requirement details; every requirement must identify user, scenario, user value, priority, source status, and matching detail ID."
input_cases:
  - eval_case: "Chinese user-driven PRD with an optional localization section"
    run_id: ""
    context_mode: "repo-backed"
    output_folder: ""
scenario_portfolio:
  context_mode: "repo-backed"
  product_type: "other"
  pm_task_type: "self_improvement"
  risk_profile: "operations"
  platform: "cross_platform"
  pm_user_maturity: "ai_product_manager"
artifact_expectations:
  prd: true
  ui_delivery: false
  tracking_plan: false
  dev_tasks: false
  launch_decision: false
  pre_clarification_only: false
generalization_boundary:
  reference_projects_are_fixtures: true
  host_specific_terms_allowed_only_in:
    - "outputs/<run-id>/"
    - "fixture-scoped eval case"
  host_specific_terms_must_not_enter:
    - "PM_COPILOT.md"
    - "workflow/"
    - "policies/"
    - "indexes/"
    - "agents/"
    - "skills/"
    - "templates/"
    - "tools/"
    - "artifacts/"
    - "guardrails/"
    - "docs/"
baseline:
  scorecard_report: "outputs/improvement-scorecard.json"
  validation_pass_rate: null
  high_severity_failures:
    - "prd_requirements_not_user_traceable"
results:
  generated_artifacts:
    - "docs/optimization-cycles/2026-07-28-user-driven-prd-template.yaml"
  validation_commands:
    - "python3 scripts/test_prd_contract.py"
    - "python3 scripts/validate_runtime_routing.py"
    - "python3 scripts/validate_repo.py"
    - "python3 scripts/run_delivery_checks.py outputs/team-projects-prd-2026-07-28 --language zh"
    - "git diff --check"
  validation_reports:
    - "outputs/team-projects-prd-2026-07-28/tool-results/delivery-check-report.json"
  review_scores:
    delivery: null
    prd: null
    metrics_tracking: null
    ui_delivery: null
    delivery_review: null
failure_classification:
  - failure_code: "prd_requirements_not_user_traceable"
    severity: "High"
    area: "PRD information architecture"
    symptom: "User needs and requirement details were diffuse instead of being traceable through a requirement list."
    evidence: "The user explicitly requested that requirement lists and details be based on users and reported excessive divergence in the current structure."
    first_surface_to_fix: "artifact contract"
fixes:
  - path: "artifacts/prd-contract.md, skills/prd-writing/SKILL.md, agents/requirements-agent.md"
    change: "Made the user-driven seven-section structure canonical and required user-to-detail traceability for every requirement."
    rationale: "Runtime instructions must make user context the source of every PRD requirement."
    fix_surface: "contract"
  - path: "templates/prd-template.md, templates/implemented-feature-prd-template.md"
    change: "Rebuilt both templates around document information, version records, requirement list, matching details, and optional research/localization/tracking sections."
    rationale: "Templates must reflect the canonical structure rather than preserve the dispersed legacy layout."
    fix_surface: "template"
  - path: "scripts/validate_outputs.py, scripts/test_prd_contract.py"
    change: "Added deterministic checks for the new section titles, user-driven requirement-list fields, and matching requirement details."
    rationale: "Validation keeps future PRDs from omitting the user-to-detail trace."
    fix_surface: "validator"
regression_updates:
  evals_added_or_updated:
    - "scripts/test_prd_contract.py user_driven_prd"
    - "scripts/test_prd_contract.py missing_user_requirement_field"
    - "scripts/test_prd_contract.py missing_matching_detail"
  validators_added_or_updated:
    - "scripts/validate_outputs.py"
versioning:
  previous_version: "4.2.1"
  new_version: "4.2.2"
  changelog_updated: true
sync:
  embedded_copies_checked:
    - "team-projects-prd-2026-07-28 output"
  embedded_copies_updated:
    - "team-projects-prd-2026-07-28 prd.md and prd.html"
  skipped_targets:
    - path: "other embedded copies"
      reason: "The user requested only the team-projects PRD example."
remote_push:
  required: false
  status: "not_requested"
  target: ""
