    severity: "High"
    area: "controller-recovery"
    symptom: "The controller can continue with a retained old trace after a trace Agent disconnect."
    evidence: "User-reported failed PRD retry."
    first_surface_to_fix: "controller"
  - failure_code: "real_figure_hash_not_reconciled_after_revision"
    severity: "High"
    area: "delivery-validation"
    symptom: "A real figure asset hash does not describe the referenced promoted file."
    evidence: "User-reported final validator error."
    first_surface_to_fix: "controller"
fixes:
  - path: "scripts/run_interactive_request.py"
    change: "Use full-stage content deadlines, a bounded trace deadline, retry only explicit disconnects, atomically promote trace output, and normalize runtime version and real-figure hashes."
    rationale: "A failed trace call cannot leave misleading historical state or block recovery for the full default stage timeout."
    fix_surface: "controller"
  - path: "scripts/test_run_interactive_request.py"
    change: "Cover trace normalization, atomic replacement, bounded trace work, and a single disconnect retry."
    rationale: "Keep the failure state and promoted bytes deterministic."
    fix_surface: "test"
