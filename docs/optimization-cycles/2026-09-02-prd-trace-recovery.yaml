cycle_id: "2026-09-02-prd-trace-recovery"
date: "2026-09-02"
goal: "Make interrupted in-place PRD revisions fail promptly and validate against a fresh, internally consistent trace."
practice_source:
  source_type: "user_feedback"
  source_run_id: "not_available"
  source_output_folder: ""
  user_corrections:
    - "A disconnected Trace Agent left the prior run log in place and held the controller after the child had exited."
  delivery_check_report: "Reported validation found a stale runtime version, historical coverage, and mismatched real-figure hashes."
observed_corrections:
  - correction: "A trace replacement must be atomically promoted only after a complete staged write."
    affected_artifact: "run-log.yaml"
    evidence: "The validator read retained historical trace fields after a disconnected trace generation call."
    severity: "High"
generalized_failures:
  - failure_code: "trace_agent_disconnect_retains_stale_trace"
    generalized_symptom: "A content-stage stream interruption can leave an earlier trace to be validated as current output."
    host_specific_details_removed: true
    reusable_rule: "Treat an explicit stream disconnect as one bounded retry, then preserve the failure reason and stop the affected stage."
  - failure_code: "real_figure_hash_not_reconciled_after_revision"
    generalized_symptom: "Trace-declared asset hashes can diverge from bytes promoted in an in-place revision."
    host_specific_details_removed: true
    reusable_rule: "Before trace validation, the controller recalculates hashes for local real-figure assets and records its active runtime version."
input_cases:
  - eval_case: "interactive-prd-trace-recovery"
    run_id: "not_available"
    context_mode: "user_feedback"
    output_folder: ""
