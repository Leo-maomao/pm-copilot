cycle_id: deterministic-trace-finalization-2026-09-04
date: 2026-09-04
goal: "Allow controller-owned PRD traces to move from truthful staging pre-final state to final validation without weakening canonical output gates."
practice_source:
  source_type: support_feedback
  source_run_id: "redacted-confirmed-prd-revision"
  source_output_folder: "not retained in this repository"
  user_corrections:
    - "Use the latest installed runtime to retry the same PRD; investigate the actual failure rather than a historical screenshot."
    - "Fix the reusable delivery cause rather than adding a scenario-specific exception."
  delivery_check_report: "Live staged validation rejected a controller-generated pre-final trace with a false quality decision."
  artifacts_reviewed:
    - "interactive-run.json"
    - "run-log.yaml"
    - "tool-results/delivery-check-report.json"
observed_corrections:
  - correction: "A pre-final trace with pending validator results must be accepted only in its controller staging workspace so the controller can finalize it from real check results."
    affected_artifact: "run-log.yaml"
    evidence: "The controller emitted valid YAML with root-level validation-result list items, while the staging exemption parsed only an indented list and therefore rejected its own trace."
    severity: High
  - correction: "An authorized in-place copy revision must update a fenced checklist when it is an exact projection of the merged localization table."
    affected_artifact: "prd.md"
    evidence: "A live staging workspace contained revised checklist rows beside a baseline fenced copy list, causing final output validation to reject an internally contradictory document."
    severity: High
generalized_failures:
  - failure_code: controller_trace_layout_mismatch
    generalized_symptom: "A validator uses formatting-sensitive text extraction to recognize a structured artifact that its producer serializes with a standards-compliant alternative layout."
    host_specific_details_removed: true
    reusable_rule: "When a gate depends on structured trace state, parse the YAML mapping and validate its exact values instead of relying on indentation-sensitive snippets."
  - failure_code: scoped_revision_mirrored_copy_divergence
    generalized_symptom: "A bounded revision updates one authoritative representation of localized copy but leaves an exact derivative representation stale."
    host_specific_details_removed: true
    reusable_rule: "When an exact derivative is mechanically tied to an authorized source table, rebuild it from the constrained merged source; preserve unrelated or non-mirrored content as protected scope."
scenario_portfolio:
  context_mode: document-backed
  product_type: other
  pm_task_type: prd
  risk_profile: operations
  platform: non_ui
  pm_user_maturity: senior_pm
artifact_expectations:
  prd: true
  ui_delivery: false
  tracking_plan: false
  dev_tasks: false
  launch_decision: false
  pre_clarification_only: false
generalization_boundary:
  reference_projects_are_fixtures: true
  host_specific_terms_allowed_only_in:
    - "outputs/<run-id>/"
    - "fixture-scoped eval case"
  host_specific_terms_must_not_enter:
    - "PM_COPILOT.md"
    - "README*.md"
    - "workflow/"
    - "prompts/"
    - "agents/"
    - "skills/"
    - "templates/"
    - "tools/"
    - "artifacts/"
    - "guardrails/"
    - "docs/"
    - "context/*.example.yaml"
failure_classification:
  - failure_code: controller_trace_layout_mismatch
    severity: High
    area: staging-validation
    symptom: "A controller-generated pre-final trace is rejected before finalization, then a no-op retry is reported as an unchanged artifact."
    evidence: "A live latest-runtime staging trace has the required degraded, pending, and false-quality fields, but the regex block parser returns no validation-result items."
    first_surface_to_fix: validator
  - failure_code: scoped_revision_mirrored_copy_divergence
    severity: High
    area: in-place-revision
    symptom: "The staged PRD contains a new localization table and an old fenced copy checklist."
    evidence: "A fresh source replay rebuilt the checklist from the constrained table and passed scope, trace, output, and full delivery checks."
    first_surface_to_fix: revision-scope-controller
fixes:
  - path: scripts/validate_outputs.py
    change: "Read the staged controller trace as a YAML mapping and require its exact pre-final mapping/list values."
    rationale: "The controller and validator now share structured semantics independent of YAML list indentation."
    fix_surface: validator
  - path: scripts/revision_scope.py
    change: "Synchronize only baseline fenced checklists that exactly mirror their adjacent constrained localization table."
    rationale: "The merged table remains the authorized source while strict adjacency and equality preserve scope boundaries."
    fix_surface: revision-scope-controller
  - path: scripts/validate_outputs.py
    change: "Recognize compact structural identifier labels separately from ordinary English UI copy."
    rationale: "Chinese product copy may retain an identifier label, but English source phrases remain invalid."
    fix_surface: validator
regression_updates:
  evals_added_or_updated: []
  validators_added_or_updated:
    - "scripts/test_validate_outputs.py"
    - "scripts/test_run_interactive_request.py"
    - "scripts/test_revision_scope.py"
versioning:
  previous_version: 6.2.108
  new_version: 6.2.109
  changelog_updated: true
sync:
  embedded_copies_checked:
    - "global PM Copilot runtime copy"
    - "Codex PM Copilot plugin source"
  embedded_copies_updated: []
  skipped_targets: []
decision:
  status: improved
  next_action: "Run release validation, install the runtime, and retry the same confirmed PRD run through the canonical MCP bridge."
