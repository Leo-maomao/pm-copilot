    first_surface_to_fix: "workflow"
fixes:
  - path: "scripts/project_workspace.py"
    change: "Use pm-copilot-outputs for global output and automatically migrate the legacy hidden directory."
    rationale: "Keep generated artifacts visible while retaining safe legacy compatibility."
    fix_surface: "workflow"
  - path: "scripts/prd_evidence_upgrade.py"
    change: "Discover the visible global output directory."
    rationale: "Keep historical PRD tooling compatible with the new rule."
    fix_surface: "tool"
  - path: "scripts/validate_outputs.py"
    change: "Accept visible global output directories as valid direct parents of run folders."
    rationale: "The output validator must enforce the resolved global path rather than only the embedded default."
    fix_surface: "validator"
  - path: "distribution/seawork-skill/SKILL.md"
    change: "Publish the visible output-directory rule to global runtime users."
    rationale: "Prevent new sessions from recreating hidden output paths."
    fix_surface: "skill"
  - path: "scripts/preflight_tools.py"
    change: "Describe runtime commands using the resolved output root."
    rationale: "Prevent global sessions from receiving embedded-only command paths."
    fix_surface: "tool"
regression_updates:
