practice_source:
  source_type: "user_feedback"
  source_name: "PRD optional-section review"
  practice: "Show optional-section content directly"
  applicability: "Chinese PRD multilingual-copy and tracking sections"
  evidence: "The user requested removal of a single-copy 6.1 subsection and explanatory tracking headers."
observed_corrections:
  - correction: "Optional PRD sections contained explanatory headings and parenthetical table headers that did not add product information."
    affected_artifact: "PRD multilingual-copy and tracking sections"
    evidence: "User asked to list a single copy set directly and remove Chinese/development explanatory labels from tracking headers and other PRD areas."
    severity: "Low"
generalized_failures:
  - failure_code: "prd_optional_section_explanatory_chrome"
    generalized_symptom: "A PRD becomes harder to scan when optional sections use structural or explanatory text instead of presenting product content directly."
    host_specific_details_removed: true
    reusable_rule: "For one multilingual-copy set, list copy directly without a numbered subsection or lead-in; use concise tracking headers without explanatory parentheses."
input_cases:
  - eval_case: "Chinese PRD with one multilingual-copy set and a tracking table"
    run_id: ""
    context_mode: "repo-backed"
    output_folder: ""
scenario_portfolio:
  context_mode: "repo-backed"
  product_type: "other"
  pm_task_type: "self_improvement"
  risk_profile: "operations"
  platform: "cross_platform"
  pm_user_maturity: "ai_product_manager"
artifact_expectations:
  prd: true
  ui_delivery: false
  tracking_plan: false
  dev_tasks: false
  launch_decision: false
  pre_clarification_only: false
generalization_boundary:
