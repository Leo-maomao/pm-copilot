    delivery_review: null
failure_classification:
  - failure_code: "prd_optional_section_explanatory_chrome"
    severity: "Low"
    area: "PRD presentation"
    symptom: "Optional sections used explanatory structure instead of direct product content."
    evidence: "The user requested concise optional sections without 6.1 or descriptive tracking headers."
    first_surface_to_fix: "artifact contract"
fixes:
  - path: "artifacts/prd-contract.md, skills/prd-writing/SKILL.md"
    change: "Defined direct single-copy presentation and concise tracking headers."
    rationale: "Optional sections should expose product content without explanatory chrome."
    fix_surface: "contract"
  - path: "templates/prd-template.md, templates/implemented-feature-prd-template.md"
    change: "Removed the 6.1 lead-in and simplified multilingual and tracking table headers."
    rationale: "Templates must produce the desired concise output by default."
    fix_surface: "template"
  - path: "scripts/validate_outputs.py, scripts/test_prd_contract.py"
    change: "Rejected the removed explanatory labels in Chinese PRDs."
    rationale: "Regression checks prevent the old optional-section presentation from returning."
    fix_surface: "validator"
regression_updates:
  evals_added_or_updated:
    - "scripts/test_prd_contract.py explanatory_copy_label"
  validators_added_or_updated:
    - "scripts/validate_outputs.py"
versioning:
