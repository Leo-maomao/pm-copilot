cycle_id: "2026-08-03-prd-template-subtraction"
date: "2026-08-03"
goal: "Use one complete PRD skeleton and delete inapplicable content instead of composing documents from a minimal scaffold."
practice_source:
  source_type: "user_confirmed_template_decision"
  user_corrections:
    - "Use a complete PRD template and remove empty sections from the delivery."
    - "Keep user-flow and operation-flow diagrams separate and optional."
    - "Name figures as 功能-状态."
generalized_failures:
  - failure_code: "minimal_scaffold_accretion"
    reusable_rule: "A PRD starts from a complete stable structure; the delivery removes blocks without content."
  - failure_code: "flowchart_semantic_blending"
    reusable_rule: "User interaction paths and operational logic use distinct optional diagram types."
  - failure_code: "figure_name_explanatory_drift"
    reusable_rule: "Figure names carry only functional area and state."
fixes:
  - path: "templates/implemented-feature-prd-template.md"
    change: "Provide the full removable PRD skeleton, optional flowchart blocks, and feature-state figure naming."
    fix_surface: "template"
  - path: "artifacts/prd-contract.md"
    change: "Make flowchart semantics and figure naming canonical."
    fix_surface: "contract"
  - path: "scripts/validate_outputs.py"
    change: "Reject controlled placeholders that are not named 功能-状态."
    fix_surface: "validator"
validation_commands:
  - "python3 scripts/test_prd_contract.py"
  - "python3 scripts/test_prd_rule_consistency.py"
  - "python3 scripts/test_prd_generation_integrity.py"
  - "python3 scripts/test_prd_flow_rendering.py"
  - "python3 scripts/validate_runtime_routing.py"
  - "python3 scripts/validate_repo.py"
versioning:
  previous_version: "4.9.5"
  new_version: "4.9.6"
  changelog_updated: true
