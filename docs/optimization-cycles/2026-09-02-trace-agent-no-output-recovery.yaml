cycle_id: "2026-09-02-trace-agent-no-output-recovery"
date: "2026-09-02"
goal: "Reduce Trace Agent stream exposure and make a terminal Agent with no staged write recoverable."
practice_source:
  source_type: "user_feedback"
  source_run_id: "not_available"
  source_output_folder: ""
  user_corrections:
    - "Investigate recurring stream disconnections rather than masking them by increasing a timeout."
  delivery_check_report: "The final Trace Agent returned idle after Codex stream reconnects without changing run-log.yaml; earlier artifacts had completed and passed staged digest checks."
observed_corrections:
  - correction: "A mechanical trace stage must not receive duplicated product context or reload broad runtime instructions."
    affected_artifact: "run-log.yaml"
    evidence: "The failed Agent consumed 38,729 input tokens, produced 368 output tokens, emitted two stream reconnects, and never opened the staged target."
    severity: "High"
  - correction: "An idle Agent with no artifact change is a no-output failure, not a successful completion."
    affected_artifact: "Interactive delivery controller"
    evidence: "Seawork's control plane reported idle despite the unchanged controller-owned staged artifact."
    severity: "Critical"
generalized_failures:
  - failure_code: "trace_agent_context_bloat_and_terminal_no_output"
    generalized_symptom: "A trace-only Agent loads excessive context, then a recovered stream can end in an idle state before its write begins."
    host_specific_details_removed: true
    reusable_rule: "Give trace-only work a compact controller evidence packet; require a staged digest change and classify no-output terminal states as bounded retry failures."
