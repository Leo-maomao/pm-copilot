self_iteration_rounds:
  - round: 1
    evidence: README led with workflow-kit positioning.
    change: Rewrote README and README.en around AI Product Manager Agent System outcomes.
  - round: 2
    evidence: PM_COPILOT mixed activation, execution detail, artifact rules, and tool rules.
    change: Reworked PM_COPILOT into Agent front door and moved detail to operating model, workflow, artifacts, and tools.
  - round: 3
    evidence: S0-S12 read as a fixed linear path.
    change: Rebuilt workflow/main-workflow.md as dynamic execution graph.
  - round: 4
    evidence: Local historical run logs lacked agent_strategy, decision_record, review_loop, and memory_candidates.
    change: Expanded run-log template and trace contract with Agent strategy fields.
  - round: 5
    evidence: Historical PRDs often lacked next actions or product judgment despite passed delivery checks.
    change: Added PM usefulness review to Review Agent and scorecard metrics.
  - round: 6
    evidence: External Agent references treat trace, handoffs, guardrails, and human-in-loop as runtime capabilities.
    change: Added validate_agent_trace.py and strict delivery-check integration.
  - round: 7
    evidence: Self-iteration needed local evidence beyond the current repo outputs.
    change: Added analyze_agent_run_evidence.py for local embedded PM Copilot outputs.
  - round: 8
    evidence: Broad Agent work needs effort budget and delegation boundaries.
    change: Added effort budgets and delegation model to the operating model and run-log.
  - round: 9
    evidence: Long or interrupted runs need reliable resume and stop semantics.
    change: Added resume_checkpoint and termination_condition to run-log, trace, orchestrator, and validator.
  - round: 10
    evidence: New capabilities must be discoverable by tools and release validation.
    change: Registered validation.agent_trace and analysis.agent_runs in tool registry and preflight.
