date: 2026-07-09
version: 3.0.0
source:
  type: user_requested_system_upgrade
  summary: PM Copilot had accumulated workflow-heavy, overlapping, and stale instructions after many real project iterations. The user requested a broad system upgrade that makes the project feel like a useful AI product manager agent instead of a rigid workflow.
generalized_failure:
  - The public entry described repository/workflow assets before practical PM outcomes.
  - The main entry mixed activation, operating model, long execution details, artifact rules, and tool rules in one file.
  - S0-S12 read as the primary experience instead of an execution graph.
  - Run traces did not make strategy, task mode, autonomy level, product judgment, review loop, next actions, and memory candidates first-class.
  - Legacy package naming and stale metadata reduced engineering clarity.
fix_surface:
  - README.md
  - README.en.md
  - PM_COPILOT.md
  - agents/
  - workflow/
  - artifacts/
  - prompts/
  - templates/
  - docs/
  - evals/
  - scripts/
  - skills/
changes:
  - Added Agent operating model with Observe, Frame, Decide, Act, Verify, Learn.
  - Added task modes and autonomy levels.
  - Reworked main workflow into an execution graph.
  - Added delivery-check workflow and kept package workflow as compatibility redirect.
  - Added user-facing use cases, output gallery, agent modes, and 3.0 migration docs.
  - Expanded run-log, trace, prompt, agent interface, PM Orchestrator, and Review Agent contracts.
  - Added 3.0 agentic system eval.
  - Expanded repository validation for 3.0 positioning and stale metadata.
  - Added explicit legacy run-id compatibility for retained local 2.x evidence runs so 3.0 delivery checks can keep historical regressions active without weakening new output naming.
