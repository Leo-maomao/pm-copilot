cycle_id: "concise-prd-details-2026-07-28"
date: "2026-07-28"
goal: "Keep requirement details compact and remove risk, pending-confirmation, acceptance-result, and redundant tracking fields."
practice_source:
  source_type: "user_correction"
  source_run_id: "team-projects-prd-2026-07-28"
  source_output_folder: "outputs/team-projects-prd-2026-07-28"
  user_corrections:
    - "Merge detail content whenever possible and use ordered labels inside cells."
    - "Remove risk / pending-confirmation and acceptance-result fields."
    - "Tracking needs only Chinese event name, engineering event name, trigger timing, extra parameters, and notes."
  delivery_check_report: "outputs/team-projects-prd-2026-07-28/tool-results/delivery-check-report.json"
  artifacts_reviewed:
    - "artifacts/prd-contract.md"
    - "skills/prd-writing/SKILL.md"
    - "templates/prd-template.md"
    - "templates/implemented-feature-prd-template.md"
    - "scripts/validate_outputs.py"
observed_corrections:
  - correction: "Requirement details contained too many separate rows, including risk, pending-confirmation, and acceptance-result fields that did not belong in the user's preferred product document."
    affected_artifact: "PRD requirement-detail and tracking templates"
    evidence: "User review of the standardized PRD template requested merged detail cells, ordered labels, removal of the three fields, and a five-column tracking table."
    severity: "Medium"
generalized_failures:
  - failure_code: "prd_detail_overfragmentation"
    generalized_symptom: "A PRD can become verbose and difficult to scan when related user behavior is split into many fixed rows instead of concise product-focused groups."
    host_specific_details_removed: true
    reusable_rule: "Use merged requirement-detail fields and ordered labels for multi-step behavior; do not add risk, pending-confirmation, acceptance-result, or technical-test rows by default."
