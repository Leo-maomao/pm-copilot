cycle: prd-figure-coverage-and-caption-repair
date: 2026-07-29
version_change: 4.8.3 -> 4.8.4
source_run: local historical PRD review after user-reported unused assets and ambiguous multi-image captions
generalized_failure: >-
  The PRD generator treated real screenshot assets as optional candidates and used one
  shared caption after multiple images, making some provided assets disappear from the
  document and leaving readers unable to associate an image with its explanation.
fix_surface:
  - scripts/format_prd_figures.py
  - scripts/render_prd_html.py
  - scripts/validate_outputs.py
  - scripts/prd_evidence_upgrade.py
  - scripts/test_prd_figure_format.py
decisions:
  coverage: Every real local image asset in an output must be referenced by the requirement detail it supports.
  caption: Every image reference is immediately followed by a concise 图示 caption; spacing is reserved for the next image, not between the image and its caption.
  migration: Legacy figure rows are normalized idempotently and do not alter requirement text, scope, or image order.
validation:
  - python3 scripts/test_prd_figure_format.py
  - python3 scripts/test_prd_evidence_upgrade.py
  - python3 scripts/test_prd_fidelity_audit.py
  - python3 scripts/test_prd_contract.py
  - python3 scripts/validate_runtime_routing.py
  - python3 scripts/validate_repo.py
  - full local asset-to-PRD reference audit
publish:
  remote_push_status: not pushed in this change set
  embedded_copy_sync_targets: pending after review
