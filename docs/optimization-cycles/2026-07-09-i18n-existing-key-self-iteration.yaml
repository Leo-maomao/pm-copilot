cycle_id: i18n-existing-key-self-iteration-2026-07-09
date: "2026-07-09"
goal: "Prevent PM Copilot self-iterations and PRD i18n extraction from missing required closure steps."
practice_source:
  source_type: real_user_run
  source_run_id: local-real-run-2026-07-09
  source_output_folder: "outputs/<run-id>/"
  user_corrections:
    - "Pure-text i18n extraction must not include copy that already has an i18n key."
    - "PM Copilot self-iteration should automatically update version, changelog, release evidence, and sync records."
  delivery_check_report: "outputs/<run-id>/tool-results/delivery-check-report.json"
  artifacts_reviewed:
    - "prd.md"
    - "prd.html"
    - "run-log.yaml"
observed_corrections:
  - correction: "Remove existing-key copy from PRD pure-text i18n extraction and keep it only in the usage/key mapping."
    affected_artifact: "prd.md"
    evidence: "Existing-key copy appeared in the localization handoff block."
    severity: Medium
  - correction: "Complete self-iteration release metadata instead of stopping after source edits and validation."
    affected_artifact: "pm-copilot source"
    evidence: "VERSION, CHANGELOG, and optimization-cycle record were not updated during the first self-iteration pass."
    severity: Medium
generalized_failures:
  - failure_code: i18n_existing_key_reextraction
    generalized_symptom: "A PRD extracts UI copy for localization even though the same copy is already declared as existing-key reuse."
    host_specific_details_removed: true
    reusable_rule: "Pure-text i18n extraction includes only brand-new UI copy with no existing key; existing-key copy belongs only in the mapping table."
  - failure_code: self_iteration_release_closure_missing
    generalized_symptom: "A PM Copilot self-iteration changes core source files but misses version, changelog, optimization-cycle, push, or embedded-copy sync evidence."
    host_specific_details_removed: true
    reusable_rule: "Core PM Copilot source changes must be accompanied by release metadata and an optimization-cycle note, or validation fails when git metadata is available."
fixes:
  - path: "artifacts/prd-contract.md"
    change: "Clarified that pure-text extraction excludes existing-key copy."
    rationale: "Make the artifact contract unambiguous for localization handoff."
    fix_surface: contract
  - path: "templates/prd-template.md"
    change: "Clarified pure-text extraction comments."
    rationale: "Make default PRD structure nudge agents away from duplicate localization requests."
    fix_surface: template
  - path: "templates/implemented-feature-prd-template.md"
    change: "Clarified pure-text extraction comments."
    rationale: "Apply the same rule to implemented-feature PRDs."
    fix_surface: template
  - path: "skills/prd-writing/SKILL.md"
    change: "Added repo-backed i18n key lookup before pure-text extraction."
    rationale: "Make the writing workflow perform the needed search before drafting localization blocks."
    fix_surface: skill
  - path: "scripts/validate_outputs.py"
    change: "Added validation that existing-key mapping rows cannot be duplicated in pure-text extraction, while excluding no-existing-key wording from that detection."
    rationale: "Catch the failure mechanically in generated outputs."
    fix_surface: validator
  - path: "scripts/validate_repo.py"
    change: "Added self-iteration release guard for core source changes in git checkouts."
    rationale: "Prevent source-level self-iteration from omitting version, changelog, and optimization-cycle evidence."
    fix_surface: validator
  - path: "PM_COPILOT.md"
    change: "Clarified that self-iteration must record remote-push status and embedded-copy sync targets."
    rationale: "Close the operational gap for embedded copies and missing remotes."
    fix_surface: workflow
regression_updates:
  evals_added_or_updated: []
  validators_added_or_updated:
    - "scripts/validate_outputs.py"
    - "scripts/validate_repo.py"
  rationale: "This was a narrow but repeated workflow closure issue; validator coverage was added instead of a new public fixture."
versioning:
