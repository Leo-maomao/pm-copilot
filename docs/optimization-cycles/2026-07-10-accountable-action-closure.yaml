decision:
  - Improve a generic product-agent quality gap without adding environment-specific assumptions.
generalized_failure:
  - Product recommendations can sound persuasive without making ownership or completion evidence explicit.
  - Existing next_actions are categorized by function but do not guarantee an accountable critical path.
  - A run can appear complete even when the recommendation is not traceable to a decision or blocker.
changes:
  - Added action_closure.critical_path to the run-log template and trace contract.
  - Added strict validation for action ids, owners, due phases, decision and blocker references, completion evidence, statuses, and termination alignment.
  - Updated Agent operating, orchestration, review, interface, prompt, and final-delivery rules.
  - Added scorecard and historical-evidence coverage for action closure.
  - Added a dedicated accountable action-closure eval.
