cycle_id: "2026-07-11-automated-prd-screenshot-recovery"
date: "2026-07-11"
goal: "Make real automated screenshots the default visual evidence path for PRDs, with recoverable tooling and authentication blockers, clarity validation, manual fallback, and placeholder as the final fallback."
practice_source:
  source_type: "real_user_run"
  source_run_id: "seawork-audio-node-screenshot-2026-07-11"
  source_output_folder: "artifacts/"
  user_corrections:
    - "PRD images should use direct automated screenshots instead of default placeholders."
    - "Missing browser plugins should trigger supported installation or setup before manual fallback."
    - "Missing login state should trigger user sign-in or task-scoped token recovery."
    - "Placeholders should be used only after every capture path fails."
    - "Small element screenshots must be rejected when visibly blurred."
  delivery_check_report: ""
  artifacts_reviewed:
    - "artifacts/audio-node-canvas.png"
    - "artifacts/audio-node.png"
observed_corrections:
  - correction: "Replace the placeholder-first workflow with automated screenshot acquisition and recovery."
    affected_artifact: "PRD visual evidence guidance"
    evidence: "A real browser automation run successfully captured the target UI after the built-in browser screenshot path failed."
    severity: "High"
  - correction: "Add a clarity gate for element-level screenshots."
    affected_artifact: "Embedded PRD image"
    evidence: "The full-window capture was clear while the low-resolution element capture appeared blurred at document display size."
    severity: "High"
generalized_failures:
  - failure_code: "placeholder-before-capture"
    generalized_symptom: "The workflow emits a missing-image placeholder before attempting available automated capture and recovery paths."
    host_specific_details_removed: true
    reusable_rule: "Attempt automated capture, supported setup or repair, authentication recovery, and manual capture before placeholder fallback."
  - failure_code: "unreadable-element-capture"
    generalized_symptom: "A technically valid screenshot is embedded even though it is too small or blurred at normal document width."
    host_specific_details_removed: true
    reusable_rule: "Validate clarity and retry with higher device scale, larger viewport, focused target, or contextual full-window crop."
