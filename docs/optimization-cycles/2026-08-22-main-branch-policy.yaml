id: main-branch-policy-2026-08-22
date: 2026-08-22
goal: "Keep one canonical development line so published documentation and runtime changes stay visible on the default branch."
source_run:
  source_checkout: "current PM Copilot source checkout"
  previous_runtime_version: "6.2.0"
  target_version: "6.2.1"
