fix_surface:
  - CONTRIBUTING.md
  - docs/en/contributing-guide.md
  - docs/versioning.md
  - SECURITY.md
  - docs/en/security-policy.md
  - VERSION
  - CHANGELOG.md
validation:
  - "validate_runtime_routing.py"
  - "validate_repo.py"
  - "git diff --check"
version_change: "6.2.0 -> 6.2.1"
remote_push_status: "pending until main is pushed"
embedded_copy_sync_targets:
  global_runtime: "~/.agents/pm-copilot"
  global_skill: "~/.agents/skills/pm-copilot"
stop_condition: "All future repository updates are developed, validated, committed, and pushed on main; temporary branches are removed after integration."
