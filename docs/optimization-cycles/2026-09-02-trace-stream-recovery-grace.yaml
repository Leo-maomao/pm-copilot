  source_type: "user_feedback"
  source_run_id: "not_available"
  source_output_folder: ""
  user_corrections:
    - "After a Trace Agent stream reconnect, keep polling its target file and eventual idle state instead of failing exactly at three minutes."
  delivery_check_report: "The Trace Agent remained attributable but had not updated run-log.yaml before the controller's three-minute deadline."
observed_corrections:
  - correction: "The controller-level disabled first-write watchdog must reach the detached Seawork polling path."
    affected_artifact: "Trace Agent completion evidence"
    evidence: "Seawork polling independently used its default first-write deadline and the trace-stage budget had no reconnect grace."
    severity: "High"
generalized_failures:
