    generalized_symptom: "A small trace stage can lose an attributable in-progress Agent at its primary deadline during a transient transport reconnect."
    host_specific_details_removed: true
    reusable_rule: "Trace delivery uses a bounded primary budget plus a stream-recovery polling grace, and its first-write policy is propagated to every execution adapter."
