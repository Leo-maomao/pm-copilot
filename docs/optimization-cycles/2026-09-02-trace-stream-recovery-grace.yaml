fixes:
  - path: "scripts/run_interactive_request.py"
    change: "Use a three-minute Trace Agent primary budget plus a two-minute reconnect grace while keeping review stages at the primary budget."
    rationale: "The same attributable Agent can finish a delayed target without an unbounded controller hang."
    fix_surface: "controller"
  - path: "scripts/agent_runtime.py"
    change: "Pass first_artifact_seconds to detached Seawork polling and honor None for content stages."
    rationale: "The runtime adapter cannot reintroduce a watchdog the controller deliberately disabled."
    fix_surface: "runtime"
  - path: "scripts/test_agent_runtime.py"
    change: "Cover disabled first-write watchdog propagation for Seawork content work."
    rationale: "Keep retry behavior consistent across direct and detached providers."
    fix_surface: "test"
