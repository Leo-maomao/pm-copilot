cycle_id: "2026-08-03-placeholder-prd-delivery-gate"
date: "2026-08-03"
goal: "Keep evidence-backed implemented-feature PRDs reviewable when live UI capture is unavailable."
practice_source:
  source_type: "user_feedback"
  source_run_id: "canvas-media-editing-prd-v2-2026-07-31"
  source_output_folder: "pm-copilot-outputs/canvas-media-editing-prd-v2-2026-07-31"
  user_corrections:
    - "When real UI cannot be accessed, use controlled placeholders and clearly ask a human to complete them instead of degrading the PRD."
  delivery_check_report: "run_delivery_checks.py rejected the source run because its trace was incomplete."
observed_corrections:
  - correction: "A missing authenticated UI state must become an explicit manual-completion task, not a silent reduction in deliverability."
    affected_artifact: "Implemented-feature PRD visual evidence"
    evidence: "User-confirmed correction on 2026-08-03."
    severity: "High"
generalized_failures:
  - failure_code: "placeholder_without_manual_completion_contract"
    generalized_symptom: "A controlled placeholder can be present without a visible reviewer reminder or an accountable replacement action."
    host_specific_details_removed: true
    reusable_rule: "Required placeholders remain inline, visibly request manual completion, and carry one pending replacement action per missing figure."
input_cases:
  - eval_case: "implemented-feature-placeholder-manual-completion"
    run_id: "canvas-media-editing-prd-v2-2026-07-31"
    context_mode: "implementation-evidence"
    output_folder: ""
scenario_portfolio:
  context_mode: "implementation-evidence"
  product_type: "other"
  pm_task_type: "implemented_feature_prd"
  risk_profile: "normal"
  platform: "web"
  pm_user_maturity: "senior_pm"
artifact_expectations:
  prd: true
  ui_delivery: false
  tracking_plan: false
  dev_tasks: false
  launch_decision: false
  pre_clarification_only: false
generalization_boundary:
  reference_projects_are_fixtures: true
  host_specific_terms_allowed_only_in:
    - "outputs/<run-id>/"
    - "fixture-scoped eval case"
  host_specific_terms_must_not_enter:
    - "PM_COPILOT.md"
    - "README*.md"
    - "workflow/"
    - "prompts/"
    - "agents/"
    - "skills/"
    - "templates/"
    - "tools/"
    - "artifacts/"
    - "guardrails/"
    - "docs/"
    - "context/*.example.yaml"
baseline:
  scorecard_report: ""
  validation_pass_rate: null
  high_severity_failures:
    - "Controlled placeholders had no enforced human-completion contract."
results:
  generated_artifacts: []
  validation_commands:
    - "python3 scripts/test_prd_contract.py"
    - "python3 scripts/validate_runtime_routing.py"
    - "python3 scripts/validate_repo.py"
  validation_reports: []
  review_scores:
    delivery: null
    prd: null
    metrics_tracking: null
    ui_delivery: null
    delivery_review: null
failure_classification:
  - failure_code: "placeholder_without_manual_completion_contract"
    severity: "High"
    area: "delivery-validation"
    symptom: "Reviewers can receive a PRD with unresolved visual evidence but no direct completion instruction."
    evidence: "User feedback and failed source-run validation"
    first_surface_to_fix: "contract"
fixes:
  - path: "artifacts/prd-contract.md"
    change: "Define visible manual-completion status and one replacement action per required placeholder."
    rationale: "Keep PRD review moving without concealing missing visual evidence."
    fix_surface: "contract"
  - path: "scripts/validate_outputs.py"
    change: "Reject placeholder runs without visible notice, pending completion state, replacement instruction, or review-ready PRD status."
    rationale: "Make the fallback deterministic and enforceable."
    fix_surface: "validator"
  - path: "scripts/test_prd_contract.py"
    change: "Cover accepted and rejected manual-placeholder scenarios."
    rationale: "Prevent regression."
    fix_surface: "test"
regression_updates:
  evals_added_or_updated: []
  validators_added_or_updated:
    - "scripts/test_prd_contract.py"
versioning:
  previous_version: "4.9.2"
  new_version: "4.9.3"
  changelog_updated: true
sync:
  embedded_copies_checked:
    - "Global runtime only; project-local embedded copies are not required."
  embedded_copies_updated: []
  skipped_targets:
    - path: "origin/main"
      reason: "Remote push is pending local validation and explicit release handoff."
after:
