cycle: prd-figure-name-and-display-unification
date: 2026-07-30
version_change: 4.8.9 -> 4.8.10
source_run: user review of a newly generated PRD with descriptive image captions and oversized multi-image gaps
generalized_failure: >-
  Figure generation, formatting, validation, and written rules allowed conflicting caption styles,
  including file extensions, capture metadata, Demo notes, and double line breaks.
fix_surface:
  - artifacts/prd-contract.md
  - docs/implemented-feature-prd-workflow.md
  - scripts/format_prd_figures.py
  - scripts/validate_outputs.py
  - scripts/test_prd_figure_format.py
  - scripts/test_prd_contract.py
decisions:
  real_figure_name: Functional area plus key state only; no extensions, capture metadata, or explanatory text.
  figure_display: Image followed immediately by the same name; one visual line break separates pairs.
  placeholder_display: Only 占位图：图片名称 in the PRD; all failure and context detail stays in internal evidence.
validation:
  - python3 scripts/test_prd_figure_format.py
  - python3 scripts/test_prd_contract.py
  - python3 scripts/test_prd_evidence_upgrade.py
  - python3 scripts/validate_outputs.py <each local PRD output>
  - python3 scripts/validate_repo.py
publish:
  remote_push_status: pending
  embedded_copy_sync_targets: all local embedded PM Copilot copies after validation
