id: prd-production-controller-hard-gate-2026-08-22
date: 2026-08-22
goal: "Ensure natural-language PRD requests cannot bypass the production workflow or claim completion without attributable Agent evidence."
canonical_rules:
  - PM_COPILOT.md#prd-production-controller-mandate
  - scripts/run_interactive_request.py
  - scripts/prd_request_controller.py
changes:
  - "Added a canonical natural-language PRD controller entry point."
  - "Required provider/model evidence for intake, clarification review, delivery, and stage quality review calls."
  - "Required explicit confirmation, all contracted artifacts, stage reviews, and final validation before complete status."
  - "Added adapter instructions forbidding direct chat PRD drafting."
validation:
  - "scripts/test_prd_request_controller.py"
  - "scripts/test_run_interactive_request.py"
  - "scripts/validate_runtime_routing.py"
  - "scripts/validate_repo.py"
stop_condition: "A missing or unauthenticated Agent call produces failed/blocked state and no final PRD claim."
