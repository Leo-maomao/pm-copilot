  - "Remove unsupported pending language from the stage-reviewable trace preflight contract."
  - "Add structured agent transition evidence for prd.html and fixed figure validation."
  - "Freeze confirmed facts once and reuse them across all downstream Agent turns."
  - "Enforce generic revision scope and canonical diagnostic isolation at controller boundaries."
  - "Treat requirement IDs as optional hints rather than a user-facing revision gate."
  - "Derive deterministic revision trace scope from confirmed natural-language requests and staged PRD diffs instead of a historical example requirement."
  - "Filter retired IDs against the staged PRD and emit complete per-requirement trace coverage."
  - "Treat revision scope mismatches as resumable needs_input questions rather than terminal delivery failures."
  - "Populate changed copy evidence from the staged PRD and align handoff readiness with generated artifacts."
validation:
