  - "Persist recovery_required/retry_required at aggregate budget boundaries."
  - "Add regression coverage for aggregate budget exhaustion."
  - "Finalize deterministic trace termination and validation_results only from actual controller validator results."
  - "Run deterministic trace finalization before pending-state validation can select a repair loop."
  - "Keep the trace artifact stage-reviewable while separating preflight from final delivery validation."
