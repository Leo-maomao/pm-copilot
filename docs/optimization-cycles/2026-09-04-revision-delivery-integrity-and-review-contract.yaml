id: revision-delivery-integrity-and-review-contract-2026-09-04
date: 2026-09-04
goal: "Make all three PRD operations reliable when runtime transport, staged assets, and independent review disagree."
practice_source:
  source_type: support_feedback
  source_run_id: "redacted-confirmed-in-place-revision"
  source_output_folder: "not retained in this repository"
  user_corrections:
    - "A controller failure must not turn a confirmed local revision into a repeated clarification request."
    - "Only actual staged content and selected requirements may control promotion or writer repair."
  delivery_check_report: "controller state, staged-artifact evidence, and runtime attribution records"
  artifacts_reviewed:
    - "interactive-run.json"
    - "revision-evidence.json"
    - "run-log.yaml"
observed_corrections:
  - correction: "Treat delayed control-plane visibility as an attributed startup condition, not immediate proof that a detached worker is absent."
    affected_artifact: "interactive delivery runtime"
    evidence: "A detached launch returned an exact Agent ID, but the first inspect response omitted its record before the worker reached an idle terminal state."
    severity: High
  - correction: "Keep local revision scope, asset bytes, and review repairs inside the controller-owned staged contract."
    affected_artifact: "in-place PRD revision"
    evidence: "Operating-system metadata, ephemeral attachments, unselected writer rewrites, and free-form reviewer findings could alter the delivery decision."
    severity: High
generalized_failures:
  - failure_code: delayed_detached_agent_attribution
    generalized_symptom: "An asynchronous scheduler can acknowledge a worker before its exact record becomes queryable."
    host_specific_details_removed: true
    reusable_rule: "Retry only a bounded exact-ID startup-attribution window; require provider/model, terminal state, and staged-artifact evidence before completion."
  - failure_code: staged_asset_boundary_leak
    generalized_symptom: "Metadata, symbolic links, or transient caller paths can make the controller validate bytes that are not durable delivery inputs."
    host_specific_details_removed: true
    reusable_rule: "Use one content-asset predicate everywhere, reject links, and bind attachments to controller-owned content-addressed snapshots before staging."
  - failure_code: revision_reviewer_scope_leak
    generalized_symptom: "A free-form reviewer can reopen protected baseline scope or demand evidence that the controller already verified."
    host_specific_details_removed: true
    reusable_rule: "Constrain a local revision to frozen selected sections and accept only typed, selected-ID review findings against an isolated review copy."
scenario_portfolio:
  context_mode: document-backed
  product_type: other
  pm_task_type: prd
  risk_profile: operations
  platform: non_ui
  pm_user_maturity: ai_product_manager
artifact_expectations:
  prd: true
  ui_delivery: false
  tracking_plan: false
  dev_tasks: false
  launch_decision: false
  pre_clarification_only: false
generalization_boundary:
  reference_projects_are_fixtures: true
  host_specific_terms_allowed_only_in:
    - "outputs/<run-id>/"
    - "fixture-scoped eval case"
  host_specific_terms_must_not_enter:
    - "PM_COPILOT.md"
    - "README*.md"
    - "workflow/"
    - "prompts/"
    - "agents/"
    - "skills/"
    - "templates/"
    - "tools/"
    - "artifacts/"
    - "guardrails/"
    - "docs/"
    - "context/*.example.yaml"
failure_classification:
  - failure_code: delayed_detached_agent_attribution
    severity: High
    area: runtime-attribution
    symptom: "A real worker was quarantined before an eventually consistent inspect endpoint exposed its record."
    evidence: "Launch receipt and later terminal record shared the same exact Agent ID."
    first_surface_to_fix: agent
  - failure_code: staged_asset_boundary_leak
    severity: High
    area: delivery-integrity
    symptom: "Non-deliverable files or external link targets could affect scope, evidence, or promotion checks."
    evidence: "Different pipeline steps applied inconsistent asset inventory rules."
    first_surface_to_fix: validator
  - failure_code: revision_reviewer_scope_leak
    severity: High
    area: review-contract
    symptom: "A reviewer could direct an in-place writer outside selected scope or repeat controller-owned provenance checks."
    evidence: "Reviewer output used an unconstrained string list and its prompt could resolve the mutable delivery path."
    first_surface_to_fix: contract
fixes:
  - path: scripts/agent_runtime.py
    change: "Retry bounded exact-ID Seawork startup attribution before accepting a control-plane failure."
    rationale: "A scheduler acknowledgement and inspect index do not share one atomic visibility point."
    fix_surface: agent
  - path: scripts/revision_scope.py
    change: "Unify content-asset filtering, reject symbolic links, attest selected assets, and deterministically merge selected revision changes into frozen baseline content."
    rationale: "The validator owns byte boundaries and protected content preservation."
    fix_surface: validator
  - path: scripts/run_interactive_request.py
    change: "Snapshot attachments, restore only byte-identical manifests, stage content-only assets, and enforce isolated typed revision reviews."
    rationale: "The controller owns durable inputs, staged artifacts, and repair authority."
    fix_surface: workflow
  - path: scripts/prd_evidence_upgrade.py
    change: "Apply the same content-asset filter when discovering visual evidence."
    rationale: "Evidence discovery must agree with staging and final validation."
    fix_surface: validator
regression_updates:
  evals_added_or_updated:
    - "Delayed exact-Agent inspect visibility fixture"
    - "Missing or tampered attachment manifest recovery fixture"
    - "Hidden metadata and symbolic-link asset inventory fixtures"
    - "Unselected revision rewrite restoration fixture"
    - "Typed review finding, provenance rejection, and isolated review workspace fixtures"
  validators_added_or_updated:
    - "scripts/revision_scope.py"
    - "scripts/run_interactive_request.py"
    - "scripts/agent_runtime.py"
versioning:
  previous_version: 6.2.106
  new_version: 6.2.107
  changelog_updated: true
sync:
  embedded_copies_checked:
    - "global PM Copilot runtime copy"
    - "Codex PM Copilot plugin cache"
  embedded_copies_updated: []
  skipped_targets: []
decision:
  status: improved
  next_action: "Run repository validation, install the current runtime, and resume the confirmed canonical PRD revision through automatic runtime selection."
