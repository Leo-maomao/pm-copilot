    - "guardrails/"
    - "docs/"
baseline:
  scorecard_report: "outputs/improvement-scorecard.json"
  validation_pass_rate: null
  high_severity_failures: []
results:
  generated_artifacts:
    - "docs/optimization-cycles/2026-07-28-prd-flow-and-evidence-detail.yaml"
  validation_commands:
    - "python3 scripts/test_prd_flow_rendering.py"
    - "python3 scripts/test_prd_contract.py"
    - "python3 scripts/validate_runtime_routing.py"
    - "python3 scripts/validate_repo.py"
    - "python3 scripts/run_delivery_checks.py outputs/team-projects-prd-2026-07-28 --language zh"
    - "git diff --check"
  validation_reports:
    - "outputs/team-projects-prd-2026-07-28/tool-results/delivery-check-report.json"
  review_scores:
    delivery: null
    prd: null
    metrics_tracking: null
    ui_delivery: null
    delivery_review: null
failure_classification:
  - failure_code: "prd_flow_detail_and_evidence_ambiguity"
    severity: "Medium"
    area: "PRD requirement-detail presentation"
    symptom: "Flow types, detailed rules, and visual evidence did not provide enough review-focused separation."
    evidence: "The user requested distinct diagram choices, table placement, hierarchical detail labels, and cropped screenshots."
    first_surface_to_fix: "artifact contract"
fixes:
  - path: "artifacts/prd-contract.md, artifacts/artifact-contracts.md, agents/requirements-agent.md, skills/prd-writing/SKILL.md"
    change: "Defined distinct flowchart roles, table placement, hierarchical detail labels, and focused-crop evidence guidance."
    rationale: "The PRD stays readable when each artifact proves one kind of product behavior."
    fix_surface: "contract"
  - path: "scripts/render_prd_html.py, scripts/test_prd_flow_rendering.py"
    change: "Rendered adjacent user and operation flowcharts as a responsive two-column group and tested the table requirement."
    rationale: "The HTML presentation must make the two complementary diagrams easy to compare without removing the specification table."
    fix_surface: "renderer"
  - path: "templates/prd-template.md, templates/implemented-feature-prd-template.md"
    change: "Added hierarchical numbering and focused-crop guidance to the detail-table fields."
    rationale: "Templates must prompt readable detail structure and proportionate visual evidence."
    fix_surface: "template"
regression_updates:
  evals_added_or_updated:
    - "scripts/test_prd_flow_rendering.py paired_flowcharts_use_grid"
    - "scripts/test_prd_flow_rendering.py flowchart_without_table_rejected"
  validators_added_or_updated:
    - "scripts/validate_outputs.py"
versioning:
  previous_version: "4.2.6"
  new_version: "4.2.7"
  changelog_updated: true
sync:
