practice_source:
  source_type: "user_feedback"
  source_name: "PRD flow and evidence review"
  practice: "Use distinct flow diagrams, hierarchical details, and focused visual evidence"
  applicability: "Chinese PRD requirement details, flow diagrams, and inline screenshots"
  evidence: "The user clarified that user and operation flowcharts are different, required their detail table below, requested clearer hierarchical numbering, and asked for cropped screenshots instead of full-screen evidence by default."
observed_corrections:
  - correction: "The PRD used one undifferentiated flowchart, flat numbered detail cells, and full-screen screenshots even when focused evidence was sufficient."
    affected_artifact: "Requirement-detail presentation and HTML rendering"
    evidence: "User review of the team-projects PRD requested dual flowcharts, a visible table beneath them, nested grouping, and target-area screenshot crops."
    severity: "Medium"
generalized_failures:
  - failure_code: "prd_flow_detail_and_evidence_ambiguity"
    generalized_symptom: "A PRD is harder to review when user paths and operational rules share one diagram, detailed rules are a flat list, or screenshots contain unrelated page area."
    host_specific_details_removed: true
    reusable_rule: "Choose user and operation flowcharts independently; keep the matching detail table below them, group complex rules hierarchically, and prefer focused evidence crops."
input_cases:
  - eval_case: "Chinese PRD with paired flowcharts and component-level screenshot evidence"
    run_id: ""
    context_mode: "repo-backed"
    output_folder: ""
scenario_portfolio:
  context_mode: "repo-backed"
  product_type: "other"
  pm_task_type: "self_improvement"
  risk_profile: "operations"
  platform: "cross_platform"
  pm_user_maturity: "ai_product_manager"
artifact_expectations:
  prd: true
  ui_delivery: false
  tracking_plan: false
  dev_tasks: false
