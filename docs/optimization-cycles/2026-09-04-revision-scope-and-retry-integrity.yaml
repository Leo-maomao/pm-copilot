id: revision-scope-and-retry-integrity-2026-09-04
date: 2026-09-04
goal: "Make all three PRD operations reliable: new creation, constrained in-place revision, and extraction into a new PRD."
practice_source:
  source_type: support_feedback
  source_run_id: ""
  source_output_folder: "not retained in this repository"
  user_corrections:
    - "A local image constraint for a selected requirement was reinterpreted as a whole-document image limit."
    - "Repeated recovery attempts launched the same delivery work without an input or runtime change."
  delivery_check_report: "controller and staged-artifact evidence"
  artifacts_reviewed:
    - "interactive-run.json"
    - "revision-evidence.json"
    - "run-log.yaml"
observed_corrections:
  - correction: "Keep a confirmed local revision boundary executable across writers, reviewers, renderers, and final promotion."
    affected_artifact: "in-place PRD revision"
    evidence: "The prior controller retained only selected IDs and delegated image interpretation to free-text review."
    severity: High
  - correction: "Stop identical no-progress recovery loops before another Agent call."
    affected_artifact: "interactive delivery controller"
    evidence: "A canonical run accumulated repeated delivery attempts without a material input, runtime, model, baseline, or code change."
    severity: High
generalized_failures:
  - failure_code: revision_scope_contract_missing
    generalized_symptom: "A local confirmed constraint can be reinterpreted as a global document rule when only a textual selector is persisted."
    host_specific_details_removed: true
    reusable_rule: "Persist controller-owned selected-section constraints and validate them deterministically before review and promotion."
  - failure_code: identical_delivery_retry_loop
    generalized_symptom: "An interrupted delivery can relaunch equivalent work indefinitely when retry state has no durable no-progress identity."
    host_specific_details_removed: true
    reusable_rule: "Fingerprint the failed delivery conditions and require a material change after the configured identical no-progress budget."
  - failure_code: revision_derivative_and_mode_leak
    generalized_symptom: "A strict revision boundary can reject its required version-history derivative, while stale revision state can leak into a different PRD operation mode."
    host_specific_details_removed: true
    reusable_rule: "Permit only verified controller-defined derivatives, and make every state transition key off the explicit delivery variant."
scenario_portfolio:
  context_mode: document-backed
  product_type: other
  pm_task_type: prd
  risk_profile: operations
  platform: non_ui
  pm_user_maturity: ai_product_manager
artifact_expectations:
  prd: true
  ui_delivery: false
  tracking_plan: false
  dev_tasks: false
  launch_decision: false
  pre_clarification_only: false
generalization_boundary:
  reference_projects_are_fixtures: true
  host_specific_terms_allowed_only_in:
    - "outputs/<run-id>/"
    - "fixture-scoped eval case"
  host_specific_terms_must_not_enter:
    - "PM_COPILOT.md"
    - "README*.md"
    - "workflow/"
    - "prompts/"
    - "agents/"
    - "skills/"
    - "templates/"
    - "tools/"
    - "artifacts/"
    - "guardrails/"
    - "docs/"
    - "context/*.example.yaml"
failure_classification:
  - failure_code: revision_scope_contract_missing
    severity: High
    area: controller-validation
    symptom: "Scope was frozen only as natural language and could conflict with global validation or review."
    evidence: "Selected-section image and copy constraints were not part of the staged validation contract."
    first_surface_to_fix: validator
  - failure_code: identical_delivery_retry_loop
    severity: High
    area: recovery-control
    symptom: "Equivalent recoveries could restart after no measurable progress."
    evidence: "No persistent fingerprint linked a resumed attempt to the failed delivery conditions."
    first_surface_to_fix: workflow
  - failure_code: revision_derivative_and_mode_leak
    severity: High
    area: scope-and-state-integrity
    symptom: "Material revisions need append-only version history, and new/extracted PRDs must not inherit revision-only promotion requirements."
    evidence: "The controller compared all outer Markdown and several paths inferred revision mode solely from retained history."
    first_surface_to_fix: validator
fixes:
  - path: scripts/revision_scope.py
    change: "Add a controller-owned manifest and Markdown/HTML selected-section validation."
    rationale: "Local constraints must survive model and reviewer interpretation."
    fix_surface: validator
  - path: scripts/run_interactive_request.py
    change: "Materialize, stage, promote, and review scope evidence atomically; record and enforce failure fingerprints."
    rationale: "The controller owns delivery boundaries and retry decisions."
    fix_surface: workflow
  - path: scripts/delivery_failure_guard.py
    change: "Add stable no-progress fingerprint and threshold decision helpers."
    rationale: "A retry budget must be keyed to meaningful delivery conditions."
    fix_surface: guardrail
  - path: scripts/revision_scope.py
    change: "Permit and require only one structurally complete append-only version-history record for a material scoped change; reject it for media-only changes."
    rationale: "Revision contracts must preserve administrative history without allowing a document-wide metadata escape."
    fix_surface: validator
  - path: scripts/run_interactive_request.py
    change: "Use explicit delivery variants for staging, lineage, promotion, and recovery instead of residual revision history."
    rationale: "New and extracted PRD operations must remain independent from prior in-place revisions."
    fix_surface: workflow
  - path: plugins/pm-copilot/scripts/pm_copilot_mcp.py
    change: "Report cached-wrapper and canonical-runtime provenance."
    rationale: "Operators need to know when a persistent wrapper requires restart."
    fix_surface: tool
regression_updates:
  evals_added_or_updated:
    - "Selected requirement image/order and linked-copy scope fixture"
    - "Unselected section and asset preservation fixture"
    - "Identical delivery recovery circuit-breaker fixture"
    - "Revision scope-report transactional promotion fixture"
    - "Material version-history append and layout-only rejection fixtures"
    - "New delivery with residual legacy revision history fixture"
  validators_added_or_updated:
    - "scripts/revision_scope.py"
    - "scripts/validate_agent_trace.py"
versioning:
  previous_version: 6.2.104
  new_version: 6.2.105
  changelog_updated: true
sync:
  embedded_copies_checked:
    - "global PM Copilot runtime copy"
    - "Codex PM Copilot plugin cache"
  embedded_copies_updated: []
  skipped_targets: []
decision:
  status: improved
  next_action: "Run repository validation, install the current runtime, and verify a canonical PRD retry without a hardcoded provider or model."
