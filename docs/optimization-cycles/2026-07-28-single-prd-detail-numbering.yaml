practice_source:
  source_type: "user_feedback"
  source_name: "PRD template review"
  practice: "Use one requirement identifier"
  applicability: "Chinese PRD requirement list and requirement detail traceability"
  evidence: "The user found that detail headings already use 5.1 and requested removal of redundant R1 labels."
observed_corrections:
  - correction: "Requirement details used both a 5.1 section number and an R1 identifier."
    affected_artifact: "PRD requirement list and detail headings"
    evidence: "User explicitly identified R1 as redundant after the 5.1 detail number."
    severity: "Medium"
generalized_failures:
  - failure_code: "prd_duplicate_requirement_identifiers"
    generalized_symptom: "A PRD becomes harder to scan when one requirement is represented by both a detail number and a second synthetic identifier."
    host_specific_details_removed: true
    reusable_rule: "Use the matching requirement-detail section number as the sole PRD requirement identifier; do not append R-style IDs."
input_cases:
  - eval_case: "Chinese PRD with a user-driven requirement list and numbered detail subsections"
    run_id: ""
    context_mode: "repo-backed"
    output_folder: ""
scenario_portfolio:
  context_mode: "repo-backed"
  product_type: "other"
  pm_task_type: "self_improvement"
  risk_profile: "operations"
  platform: "cross_platform"
  pm_user_maturity: "ai_product_manager"
artifact_expectations:
  prd: true
  ui_delivery: false
  tracking_plan: false
  dev_tasks: false
  launch_decision: false
  pre_clarification_only: false
generalization_boundary:
  reference_projects_are_fixtures: true
  host_specific_terms_allowed_only_in:
    - "outputs/<run-id>/"
    - "fixture-scoped eval case"
  host_specific_terms_must_not_enter:
    - "PM_COPILOT.md"
    - "workflow/"
    - "policies/"
    - "indexes/"
    - "agents/"
    - "skills/"
    - "templates/"
    - "tools/"
    - "artifacts/"
    - "guardrails/"
    - "docs/"
baseline:
  scorecard_report: "outputs/improvement-scorecard.json"
  validation_pass_rate: null
  high_severity_failures: []
results:
  generated_artifacts:
    - "docs/optimization-cycles/2026-07-28-single-prd-detail-numbering.yaml"
  validation_commands:
    - "python3 scripts/test_prd_contract.py"
    - "python3 scripts/validate_runtime_routing.py"
    - "python3 scripts/validate_repo.py"
    - "python3 scripts/run_delivery_checks.py outputs/team-projects-prd-2026-07-28 --language zh"
    - "git diff --check"
  validation_reports:
    - "outputs/team-projects-prd-2026-07-28/tool-results/delivery-check-report.json"
  review_scores:
    delivery: null
    prd: null
    metrics_tracking: null
    ui_delivery: null
    delivery_review: null
failure_classification:
  - failure_code: "prd_duplicate_requirement_identifiers"
    severity: "Medium"
    area: "PRD information architecture"
    symptom: "Requirement headings duplicated the detail number with an R-style label."
    evidence: "The user requested a single 5.1-style identifier."
    first_surface_to_fix: "artifact contract"
fixes:
  - path: "artifacts/prd-contract.md, artifacts/artifact-contracts.md, agents/requirements-agent.md, skills/prd-writing/SKILL.md"
    change: "Made the requirement-detail number the sole PRD requirement identifier."
    rationale: "One identifier keeps the requirement list and details directly traceable without redundant labels."
    fix_surface: "contract"
  - path: "templates/prd-template.md, templates/implemented-feature-prd-template.md"
    change: "Replaced the ID and matching-detail columns with one detail-number column and removed R labels from headings."
    rationale: "Templates must not require duplicate identifiers."
    fix_surface: "template"
  - path: "scripts/validate_outputs.py, scripts/test_prd_contract.py"
    change: "Validated numbered detail links and reject R labels appended to detail headings."
    rationale: "Regression checks prevent duplicate requirement identifiers from returning."
    fix_surface: "validator"
regression_updates:
  evals_added_or_updated:
    - "scripts/test_prd_contract.py duplicate_requirement_id"
    - "scripts/test_prd_contract.py missing_matching_detail"
  validators_added_or_updated:
    - "scripts/validate_outputs.py"
versioning:
  previous_version: "4.2.3"
  new_version: "4.2.4"
  changelog_updated: true
sync:
  embedded_copies_checked:
    - "team-projects-prd-2026-07-28 output"
  embedded_copies_updated:
    - "team-projects-prd-2026-07-28 prd.md and prd.html"
  skipped_targets:
    - path: "other embedded copies"
      reason: "The user requested only the team-projects PRD example."
remote_push:
  required: false
  status: "not_requested"
  target: ""
