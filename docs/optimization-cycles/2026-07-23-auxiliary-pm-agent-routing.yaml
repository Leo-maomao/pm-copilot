    symptom: "Runtime guidance mixed fixed broad loading with implementation-oriented UI paths."
    evidence: "Architecture review of entry, context-loading, UI, adapter, template, and validation surfaces."
    first_surface_to_fix: "workflow"
fixes:
  - path: "policies/role-boundary.md"
    change: "Added the auxiliary PM role, permitted evidence work, prohibited mutations, and explicit UI review boundary."
    rationale: "The role boundary is the canonical owner of what PM Copilot may and may not do."
    fix_surface: "guardrail"
  - path: "indexes/runtime-routing.yaml"
    change: "Added bootstrap documents, per-task active routes, canonical ownership, archive exclusion, and memory-selection metadata."
    rationale: "Runtime document selection must be explicit and minimal."
    fix_surface: "workflow"
  - path: "scripts/validate_runtime_routing.py"
    change: "Added deterministic validation for route paths, active status, canonical ownership, task coverage, and archive exclusion."
    rationale: "Routing drift must be caught before release."
    fix_surface: "validator"
regression_updates:
  evals_added_or_updated: []
  validators_added_or_updated:
