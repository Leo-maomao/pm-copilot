cycle_id: "auxiliary-pm-agent-routing-2026-07-23"
date: "2026-07-23"
goal: "Align PM Copilot with an auxiliary product-agent role and replace fixed broad context loading with active document routing."
practice_source:
  source_type: "manual_review"
  source_run_id: ""
  source_output_folder: ""
  user_corrections:
    - "PM Copilot is an auxiliary Product Agent Loop that covers product work but must not participate in product implementation."
    - "Document knowledge must be disclosed on demand through indexes and canonical owners rather than broad fixed reads."
  delivery_check_report: ""
  artifacts_reviewed:
    - "PM_COPILOT.md"
    - "workflow/context-loading.md"
    - "context/memory-model.md"
    - "UI delivery runtime documents"
observed_corrections:
  - correction: "Fixed first reads and source-preview implementation paths conflicted with the desired auxiliary PM role."
    affected_artifact: "runtime entry and UI delivery guidance"
    evidence: "The entry required 13 fixed documents while context loading required only relevant context; UI guidance authorized host preview/delta implementation paths."
    severity: "High"
generalized_failures:
  - failure_code: "broad_runtime_loading_and_role_drift"
    generalized_symptom: "A documentation-driven agent can load irrelevant rules and cross into implementation when runtime routing and role ownership are not explicit."
    host_specific_details_removed: true
    reusable_rule: "Use the runtime routing index and role boundary before task-specific documents; PM Copilot may inspect host evidence but cannot mutate host product state."
