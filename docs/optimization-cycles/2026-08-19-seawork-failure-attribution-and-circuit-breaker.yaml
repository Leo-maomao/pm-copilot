cycle_id: "2026-08-19-seawork-failure-attribution-and-circuit-breaker"
date: "2026-08-19"
goal: "Prevent unbounded evaluation retries and preserve causal evidence when the Seawork control plane or Agent lifecycle fails."
practice_source:
  source_type: "support_feedback"
  source_run_id: "evaluation-portfolio-2026-08-19-v8-a..f"
  source_output_folder: "outputs/evaluation-portfolio-2026-08-19-v8-*"
  user_corrections:
    - "A failed run must first identify its cause; do not retry indefinitely or spend tokens on an unavailable tool."
    - "A complete scenario requires every workflow stage and contracted artifact; a file or stale running status is not completion evidence."
  artifacts_reviewed:
    - "scripts/agent_runtime.py"
    - "scripts/run_evaluation_scenario.py"
    - "scripts/run_evaluation_portfolio.py"
    - "Seawork daemon log (user-local runtime evidence)"
observed_corrections:
  - correction: "The portfolio could continue after a daemon outage and did not retain all call-level errors."
    affected_artifact: "scripts/run_evaluation_portfolio.py"
    evidence: "v7 manifests recorded 12 daemon failures and several empty error fields."
    severity: "High"
  - correction: "A timed-out Seawork task had no durable Agent ID and its isolated workspace could be removed while the task remained active."
    affected_artifact: "scripts/agent_runtime.py"
    evidence: "Seawork stop returned Agent not found while the CLI continued to report running."
    severity: "Critical"
  - correction: "The adapter requested claude/sonnet but Seawork created claude/deepseek-v4-flash."
    affected_artifact: "scripts/agent_runtime.py"
    evidence: "Bounded probe returned requested_model=claude/sonnet and actual_model=claude/deepseek-v4-flash."
    severity: "High"
generalized_failures:
  - failure_code: "runtime-lifecycle-unattributable"
    generalized_symptom: "The caller cannot prove which external task it started or whether stop succeeded."
    reusable_rule: "Persist the external task ID, verify terminal state, and retain evidence when cleanup is unconfirmed."
  - failure_code: "infrastructure-retry-without-circuit-breaker"
    generalized_symptom: "A provider outage causes repeated work or later cases to run without new evidence."
    reusable_rule: "Allow one attributable recovery attempt, then halt the batch with a category and fingerprint."
  - failure_code: "provider-contract-mismatch"
    generalized_symptom: "A tool silently substitutes the requested provider/model."
    reusable_rule: "Compare requested and actual runtime identity before waiting for content; mismatch is infrastructure failure."
fixes:
  - path: "scripts/agent_runtime.py"
    change: "Added detached Seawork Agent ID capture, canonical CLI provider/model arguments, actual-model verification, verified timeout stop, and orphan workspace evidence."
    rationale: "Runtime identity and lifecycle are prerequisites for trustworthy scenario evidence."
  - path: "scripts/run_evaluation_scenario.py"
    change: "Retain isolated stage directories whenever Seawork stop is unconfirmed."
    rationale: "Do not delete a workspace that an external Agent may still be writing."
  - path: "scripts/run_evaluation_portfolio.py"
    change: "Added failure fingerprints, call-level errors, one-recovery retry policy, and infrastructure circuit breaker."
    rationale: "A portfolio must stop on infrastructure failure instead of consuming tokens without progress."
regression_updates:
  evals_added_or_updated:
    - "scripts/test_agent_runtime.py"
    - "scripts/test_run_evaluation_scenario.py"
    - "scripts/test_run_evaluation_portfolio.py"
  validators_added_or_updated: []
validation:
  commands:
    - "python3 scripts/test_agent_runtime.py"
    - "python3 scripts/test_run_evaluation_scenario.py"
    - "python3 scripts/test_run_evaluation_portfolio.py"
    - "python3 scripts/validate_runtime_routing.py"
    - "python3 scripts/validate_repo.py"
  results:
    - "19 runtime tests passed."
    - "25 scenario tests passed."
    - "12 portfolio tests passed."
    - "Runtime routing passed."
    - "Repository validation remains blocked by an existing tracking-plan.csv output contract failure."
  bounded_probe:
    command: "python3 scripts/agent_runtime.py execute --provider seawork-claude --timeout-minutes 1 --prompt '<READY probe>'"
    result: "failed_closed"
    evidence: "Agent ID captured; Seawork reported actual model claude/deepseek-v4-flash for requested claude/sonnet; Agent reached idle after stop."
decision:
  status: "blocked_by_external_runtime_contract"
  next_action: "Do not start portfolio cases until Seawork model routing is corrected or an explicitly accepted provider/model is configured and a fresh bounded probe passes."
