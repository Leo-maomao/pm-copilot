    fix_surface: "skill"
  - path: "skills/test-first-maintenance/SKILL.md, skills/repository-architecture-review/SKILL.md"
    change: "Added self-improvement-only skills for requested test-first maintenance and architecture review capabilities."
    rationale: "These capabilities are useful for PM Copilot maintenance but must not authorize host-product implementation."
