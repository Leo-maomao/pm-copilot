    change: "Added deterministic selector resolution from task mode and request text to local skill paths."
    rationale: "Autonomous callers can verify which optional local skills to load without directory scanning."
    fix_surface: "validator"
  - path: "skills/design-system-audit/SKILL.md, skills/review-checklist/SKILL.md, skills/requirement-intake/SKILL.md"
    change: "Absorbed visual-direction, UI-review, and decision-interview practices into existing canonical PM skills."
