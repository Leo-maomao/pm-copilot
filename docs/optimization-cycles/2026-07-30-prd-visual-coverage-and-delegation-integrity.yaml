cycle_id: "2026-07-30-prd-visual-coverage-and-delegation-integrity"
date: "2026-07-30"
source: "real embedded PM Copilot delivery correction"
scope: "generic PRD evidence, optional-section readability, and delegation execution integrity"
failure_categories:
  - "F3 workflow failure"
  - "F4 skill failure"
  - "F8 artifact failure"
  - "F9 review failure"
  - "F10 runtime failure"
severity: "high"
observed_failures:
  - "A UI-heavy implemented-feature PRD could pass without requirement-level figures or a recorded evidence decision."
  - "Omitting an optional tail section could leave a visible top-level heading-number gap."
  - "A planned multi-role run could encounter deterministic local startup failure while later workers remained running or unaccounted for."
generalized_defect: "Contracts and validators described desired agent behavior but did not enforce evidence coverage, readable section numbering, or truthful terminal orchestration state."
generalization_boundary: "No reference-product names, user identities, local host paths, routes, APIs, or domain rules are introduced into reusable PM Copilot instructions."
fixes:
  - surface: "artifacts/prd-contract.md, skills/prd-writing/SKILL.md, templates/implemented-feature-prd-template.md"
    change: "Require visual-coverage decisions and consecutive visible tail numbering."
  - surface: "scripts/validate_outputs.py"
    change: "Validate UI-surface coverage decisions, inline figure-to-requirement mapping, asset hash integrity, and tail numbering."
  - surface: "scripts/plan_agent_delegation.py, scripts/run_agent_delegation.py, scripts/agent_task_ledger.py"
    change: "Bound self-improvement evidence roles, stop deterministic startup failures before fan-out, and reject terminal ledgers with running tasks."
regressions:
  - command: "python3 scripts/test_prd_contract.py"
    covers: "numbering, missing visual coverage, and real figure mapping"
  - command: "python3 scripts/test_agent_delegation.py"
    covers: "maximum self-improvement evidence-role count"
  - command: "python3 scripts/test_agent_orchestration.py"
    covers: "deterministic startup failure prevents fan-out"
  - command: "python3 scripts/test_agent_task_ledger.py"
    covers: "terminal ledger closure"
non_goals:
  - "Do not require delegation for direct tasks with no independent evidence questions."
  - "Do not claim recovery from a failed local runtime without completed worker evidence."
status: "validated"
