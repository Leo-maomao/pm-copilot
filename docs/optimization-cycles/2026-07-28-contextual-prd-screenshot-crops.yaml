practice_source:
  source_type: "user_feedback"
  source_name: "PRD screenshot review"
  practice: "Preserve meaningful context in focused screenshot crops"
  applicability: "Chinese PRD inline screenshot selection"
  evidence: "The user noted that a focused crop still needs enough context to identify the relevant product area and comparison, such as personal versus team projects."
observed_corrections:
  - correction: "The first example crop showed the team area but removed the adjacent personal-project area needed to explain the boundary."
    affected_artifact: "Team-projects PRD visual evidence"
    evidence: "User requested that the first screenshot retain the personal-project area so the relationship is immediately clear."
    severity: "Medium"
generalized_failures:
  - failure_code: "prd_screenshot_context_overcropping"
    generalized_symptom: "A visual can become ambiguous when cropping preserves the target control but removes the page, section, or comparison context that gives it meaning."
    host_specific_details_removed: true
    reusable_rule: "For each PRD screenshot, retain the functional target, locating context, and required comparison context; do not crop to an isolated control."
input_cases:
  - eval_case: "PRD screenshot proving the boundary between adjacent product areas"
    run_id: ""
    context_mode: "repo-backed"
    output_folder: ""
