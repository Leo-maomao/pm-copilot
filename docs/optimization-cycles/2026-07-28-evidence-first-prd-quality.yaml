cycle:
  id: evidence_first_prd_quality
  date: 2026-07-28
  status: completed
  task_mode: self_improvement
  version: 4.2.9
  trigger:
    - "Placeholder screenshots prevented PRDs from becoming review-ready visual artifacts."
    - "Manual edits leaked template prose and document-operation version entries into PRDs."
    - "Requirement details needed stronger fact and uncertainty discipline."
  canonical_owners:
    - artifacts/prd-contract.md
    - skills/prd-writing/SKILL.md
    - agents/requirements-agent.md
    - scripts/validate_outputs.py
  decisions:
    - "A final PRD uses a real local visual asset or omits the 图示 row; an essential unavailable figure may use a controlled placeholder with a small location-and-purpose caption after all trusted capture paths fail."
    - "The agent selects Playwright, Chrome DevTools, or Computer Use from the available rendered source; a missing source is a run-trace evidence gap, not a PRD placeholder."
    - "Only user-confirmed, observed, or source-backed product facts enter the PRD; unresolved behavior is explicitly marked at the affected requirement or returned for a decision."
    - "Version history records product changes only."
    - "Loop rules do not imply a model provider or worker scheduler; host runtime delegation is recorded when available and explicit when unavailable."
  validations:
    - python3 scripts/test_prd_contract.py
    - python3 scripts/validate_runtime_routing.py
    - python3 scripts/validate_repo.py
    - git diff --check
