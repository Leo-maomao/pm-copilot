cycle: agent-screenshot-context-review
date: 2026-07-29
version_change: 4.8.5 -> 4.8.6
source_run: user review of PRD screenshot range and readability
generalized_failure: >-
  Existing guidance described useful crops but did not require the Agent to inspect each
  state, document its crop judgment, or remove superseded raw captures. This allowed
  execution to drift toward arbitrary full-window or overly tight screenshots.
fix_surface:
  - artifacts/prd-contract.md
  - artifacts/tool-result-contract.md
  - skills/prd-writing/SKILL.md
  - docs/implemented-feature-prd-workflow.md
decisions:
  crop_authority: The Agent selects each screenshot range after visual inspection; static dimensions and filenames are not decision rules.
  retained_evidence: Preserve the functional target, locating context, and only the comparison context needed to understand the requirement.
  asset_curation: Replace and remove superseded raw captures unless they independently support another requirement.
  trace: Store visual_capture_review internally, never as explanatory PRD text.
validation:
  - python3 scripts/validate_runtime_routing.py
  - python3 scripts/validate_repo.py
  - PRD screenshot policy review
publish:
