cycle:
  id: local_agent_runtime
  date: 2026-07-28
  status: completed
  task_mode: self_improvement
  version: 4.3.0
  trigger:
    - "Loop Engineering had bounded decisions but no local worker scheduler or model-runtime adapter."
    - "Users needed authenticated local Agent CLIs to work without copying API keys or manually wiring a provider."
  canonical_owners:
    - scripts/agent_runtime.py
    - scripts/preflight_tools.py
    - tools/tool-registry.yaml
    - agents/agent-operating-model.md
    - workflow/main-workflow.md
  decisions:
    - "Discover local runtimes automatically and never store or request API keys in PM Copilot."
    - "Select the user's active host runtime and active model before dispatch; a Seawork-backed session retains its current Agent provider/model for bounded worker/verifier loops."
    - "Use Codex CLI and Claude CLI only as verified non-interactive single-worker fallbacks."
    - "Report other detected Agent CLIs as unverified until PM Copilot has a stable, tested headless adapter; do not misrepresent GUI discovery as executable delegation."
    - "Reject credential-shaped prompts and redact credential-shaped runtime output before returning it."
  validations:
    - python3 scripts/test_agent_runtime.py
    - python3 scripts/test_agent_loop.py
    - python3 scripts/preflight_tools.py --json
    - python3 scripts/validate_runtime_routing.py
    - python3 scripts/validate_repo.py
    - git diff --check
