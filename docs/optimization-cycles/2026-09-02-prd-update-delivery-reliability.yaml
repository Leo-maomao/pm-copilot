cycle_id: "2026-09-02-prd-update-delivery-reliability"
date: "2026-09-02"
goal: "Make partial PRD updates complete reliably without expanding their validation scope."
practice_source:
  source_type: "user_feedback"
  source_run_id: "not_available"
  source_output_folder: ""
  user_corrections:
    - "Recent PRD update failures repeatedly interrupted delivery and validation."
  delivery_check_report: "No canonical output run was retained locally; the reported failure sequence and its repair scope were supplied in the active conversation."
observed_corrections:
  - correction: "Stage target detection must include dot-prefixed staging and review files."
    affected_artifact: "Interactive PRD delivery and stage review"
    evidence: "The staged artifact and review paths use dot-prefixed directory or filename segments."
    severity: "High"
generalized_failures:
  - failure_code: "stage_target_pattern_excludes_dot_prefixed_paths"
    generalized_symptom: "A monitor cannot observe a valid staged artifact when its prompt path contains dot-prefixed segments."
    host_specific_details_removed: true
    reusable_rule: "Parse write targets across every controller-generated artifact prompt, including hidden staging and review paths."
  - failure_code: "in_place_revision_validates_unchanged_requirements"
    generalized_symptom: "A local PRD repair is blocked by coverage obligations for unrelated, unchanged requirements."
    host_specific_details_removed: true
    reusable_rule: "An explicitly declared in-place revision validates exactly its changed requirement IDs while retaining full-document structural checks."
input_cases:
  - eval_case: "interactive-prd-update-reliability"
    run_id: "not_available"
    context_mode: "user_feedback"
    output_folder: ""
