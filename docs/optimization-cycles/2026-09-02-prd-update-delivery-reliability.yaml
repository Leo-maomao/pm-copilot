    delivery_review: null
failure_classification:
  - failure_code: "stage_target_pattern_excludes_dot_prefixed_paths"
    severity: "High"
    area: "runtime-monitoring"
    symptom: "Artifact-progress monitoring treats valid staged work as absent."
    evidence: "Controller prompt forms and targeted regression tests."
    first_surface_to_fix: "runtime"
  - failure_code: "in_place_revision_validates_unchanged_requirements"
    severity: "High"
    area: "delivery-validation"
    symptom: "A local revision inherits unrelated historical coverage obligations."
    evidence: "Partial-update flow and trace validator behavior."
    first_surface_to_fix: "validator"
fixes:
  - path: "scripts/agent_runtime.py"
    change: "Recognize both artifact and JSON review write prompts with dot-prefixed paths, then terminate a process that remains stalled after its artifact checkpoint."
    rationale: "Observe legitimate PRD stages while retaining a bounded cleanup path for a stalled child process."
    fix_surface: "runtime"
  - path: "scripts/run_interactive_request.py"
    change: "Exclude Finder metadata from staging and promotion, and instruct partial revisions to produce a compact current run log."
    rationale: "Prevent macOS metadata and historical trace growth from blocking a local repair."
    fix_surface: "controller"
  - path: "scripts/validate_agent_trace.py"
    change: "Scope coverage and visual-evidence checks to declared revised requirement IDs for in-place revisions."
    rationale: "Keep unchanged historical requirements outside a narrowly declared update."
    fix_surface: "validator"
  - path: "scripts/test_agent_runtime.py"
    change: "Add staged-target and post-write-stall regression coverage."
    rationale: "Prevent the runtime monitor from regressing to unsupported prompt paths or unbounded post-write processes."
    fix_surface: "test"
regression_updates:
  evals_added_or_updated: []
  validators_added_or_updated:
    - "scripts/test_agent_runtime.py"
    - "scripts/validate_agent_trace.py"
