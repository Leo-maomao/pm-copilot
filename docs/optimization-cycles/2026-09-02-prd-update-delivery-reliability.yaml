  generated_artifacts: []
  validation_commands:
    - "python3 -m unittest test_agent_runtime.py test_run_interactive_request.py test_validate_agent_trace.py"
    - "python3 scripts/validate_runtime_routing.py"
    - "python3 scripts/validate_repo.py"
  validation_reports: []
