id: confirmed-recovery-bridge-2026-09-04
date: 2026-09-04
goal: "Make confirmed PRD recovery reach the canonical controller without bypassing genuine user input."
practice_source:
  source_type: support_feedback
  source_run_id: "redacted-confirmed-in-place-revision"
  source_output_folder: "not retained in this repository"
  user_corrections:
    - "A current runtime retry must use the canonical controller rather than stop at a stale adapter status."
    - "Uncertainty must remain a user-input pause; internal recovery must not be presented as a new product decision."
  delivery_check_report: "MCP bridge state and controller migration evidence"
  artifacts_reviewed:
    - "interactive-run.json"
    - "plugins/pm-copilot/scripts/pm_copilot_mcp.py"
    - "scripts/run_interactive_request.py"
observed_corrections:
  - correction: "The bridge rejected a confirmed legacy repair pause before the canonical controller could classify it."
    affected_artifact: "interactive PRD MCP bridge"
    evidence: "The persisted run held explicit confirmation and a controller-owned scope clarification, but the wrapper rejected its needs_input status locally."
    severity: High
generalized_failures:
  - failure_code: confirmed_recovery_adapter_dead_end
    generalized_symptom: "A convenience adapter duplicates a workflow-state gate and prevents the canonical state machine from applying its own safe migration."
    host_specific_details_removed: true
    reusable_rule: "Adapters may forward explicitly confirmed recovery pauses to the canonical controller, but only the controller may clear input gates or begin delivery."
scenario_portfolio:
  context_mode: document-backed
  product_type: other
  pm_task_type: prd
  risk_profile: operations
  platform: non_ui
  pm_user_maturity: ai_product_manager
artifact_expectations:
  prd: true
  ui_delivery: false
  tracking_plan: false
  dev_tasks: false
  launch_decision: false
  pre_clarification_only: false
generalization_boundary:
  reference_projects_are_fixtures: true
  host_specific_terms_allowed_only_in:
    - "outputs/<run-id>/"
    - "fixture-scoped eval case"
  host_specific_terms_must_not_enter:
    - "PM_COPILOT.md"
    - "README*.md"
    - "workflow/"
    - "prompts/"
    - "agents/"
    - "skills/"
    - "templates/"
    - "tools/"
    - "artifacts/"
    - "guardrails/"
    - "docs/"
    - "context/*.example.yaml"
failure_classification:
  - failure_code: confirmed_recovery_adapter_dead_end
    severity: High
    area: workflow-state-routing
    symptom: "An already confirmed controller-recoverable run is stopped by a non-authoritative adapter."
    evidence: "The controller contains the migration, but the adapter blocks dispatch based on an earlier status value."
    first_surface_to_fix: workflow
fixes:
  - path: plugins/pm-copilot/scripts/pm_copilot_mcp.py
    change: "Forward a persisted-confirmation needs_input state to the canonical controller for its authoritative decision."
    rationale: "The bridge does not own the meaning of controller state or the authority to clear an input gate."
    fix_surface: workflow
  - path: scripts/run_interactive_request.py
    change: "Require an empty controller input field and no remaining must-answer questions before migrating a legacy internal scope clarification."
    rationale: "Recovery cannot suppress a real product decision or delivery input request."
    fix_surface: workflow
regression_updates:
  evals_added_or_updated:
    - "Confirmed needs_input bridge dispatch fixture"
    - "Stale scope question plus real must-answer question fixture"
    - "Stale scope question plus controller-required input fixture"
  validators_added_or_updated:
    - "scripts/test_pm_copilot_mcp.py"
    - "scripts/test_run_interactive_request.py"
versioning:
  previous_version: 6.2.107
  new_version: 6.2.108
  changelog_updated: true
sync:
  embedded_copies_checked:
    - "global PM Copilot runtime copy"
    - "Codex PM Copilot plugin cache"
  embedded_copies_updated: []
  skipped_targets: []
decision:
  status: improved
  next_action: "Run release validation, install the runtime, and retry the same confirmed PRD run through the canonical MCP bridge."
