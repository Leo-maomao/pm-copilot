fixes:
  - path: "scripts/agent_runtime.py"
    change: "Promote the capability-selected catalog option into selected_model before the Seawork empty-model guard and command construction."
    rationale: "The discovered model becomes the attributable Seawork launch target."
    fix_surface: "runtime"
  - path: "scripts/run_interactive_request.py"
    change: "Accept --model and propagate it through intake, delivery, review, repair, and recovery instructions."
    rationale: "An operator can reliably use a device-verified model across a resumed production run."
    fix_surface: "controller"
  - path: "scripts/test_agent_runtime.py"
    change: "Cover discovered model selection before Seawork command construction."
    rationale: "Prevent a catalog result from being discarded by the empty-model guard."
    fix_surface: "test"
