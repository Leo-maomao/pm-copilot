cycle_id: "2026-08-17-first-principles-and-proactive-delegation"
date: "2026-08-17"
goal: "Keep PM Copilot iterations causally tied to user outcomes and make qualifying multi-Agent delegation observable."
practice_source:
  source_type: "support_feedback"
  source_run_id: ""
  source_output_folder: ""
  user_corrections:
    - "Work backward from the desired outcome to the most direct necessary action instead of following available workflows."
    - "Do not silently execute when material questions remain or leave multi-Agent plans undispatched."
  delivery_check_report: ""
  artifacts_reviewed:
    - "agents/agent-operating-model.md"
    - "workflow/main-workflow.md"
    - "scripts/plan_agent_delegation.py"
observed_corrections:
  - correction: "The previous operating loop named stages but did not require a goal-to-blocker causal chain."
    affected_artifact: "agents/agent-operating-model.md"
    evidence: "User feedback during iterative PM Copilot maintenance."
    severity: "High"
  - correction: "Delegation was documented as optional and plans did not state why dispatch was or was not required."
    affected_artifact: "workflow/main-workflow.md"
    evidence: "Control-plane inspection showed a plan-only default and no explicit dispatch decision."
    severity: "High"
generalized_failures:
  - failure_code: "goal-means-chain-missing"
    generalized_symptom: "The agent can advance a workflow, tool, or artifact without proving it removes the current blocker to the user outcome."
    host_specific_details_removed: true
    reusable_rule: "Decompose goal to necessary conditions and select only the most direct safe blocker-removing action."
  - failure_code: "delegation-plan-without-dispatch-decision"
    generalized_symptom: "Independent evidence work can remain a documented plan instead of an executed multi-Agent run or an explained direct-path decision."
    host_specific_details_removed: true
    reusable_rule: "When independent goal-critical questions and a ready runtime exist, dispatch and persist the ledger; otherwise record why direct execution is more direct."
input_cases:
  - eval_case: "agentic-product-manager-system"
    run_id: ""
    context_mode: "brief-only"
    output_folder: ""
scenario_portfolio:
  context_mode: "brief-only"
  product_type: "other"
  pm_task_type: "review"
  risk_profile: "normal"
  platform: "non_ui"
  pm_user_maturity: "ai_product_manager"
artifact_expectations:
  prd: false
  ui_delivery: false
  tracking_plan: false
  dev_tasks: false
  launch_decision: false
  pre_clarification_only: false
generalization_boundary:
  reference_projects_are_fixtures: true
  host_specific_terms_allowed_only_in:
    - "outputs/<run-id>/"
    - "fixture-scoped eval case"
  host_specific_terms_must_not_enter:
    - "PM_COPILOT.md"
    - "README*.md"
    - "workflow/"
    - "prompts/"
    - "agents/"
    - "skills/"
    - "templates/"
    - "tools/"
    - "artifacts/"
    - "guardrails/"
    - "docs/"
    - "context/*.example.yaml"
baseline:
  scorecard_report: "not_run"
  validation_pass_rate: null
  high_severity_failures:
    - "goal-means-chain-missing"
    - "delegation-plan-without-dispatch-decision"
results:
  generated_artifacts: []
  validation_commands:
    - "python3 scripts/test_agent_delegation.py"
    - "python3 scripts/test_agent_orchestration.py"
    - "python3 scripts/test_agent_loop.py"
    - "python3 scripts/validate_runtime_routing.py"
    - "python3 scripts/validate_repo.py"
    - "python3 scripts/validate_agent_task_ledger.py <temporary-ledger>"
  validation_reports:
    - "All listed deterministic tests and repository validations passed."
    - "A real self-improvement delegation plan selected two goal-relevant evidence workers and a Review Agent."
    - "The dispatched first worker was intentionally terminated before its 15-minute runtime timeout; its ledger remained valid and resumable."
  review_scores:
    delivery: null
    prd: null
    metrics_tracking: null
    ui_delivery: null
    delivery_review: null
failure_classification:
  - failure_code: "goal-means-chain-missing"
    severity: "High"
    area: "workflow"
    symptom: "Workflow stages could be followed without identifying a direct path from goal to blocker removal."
    evidence: "User correction and operating-model review."
    first_surface_to_fix: "workflow"
  - failure_code: "delegation-plan-without-dispatch-decision"
    severity: "High"
    area: "agent"
    symptom: "A delegation plan did not state whether it must be dispatched when runtime capability is available."
    evidence: "Delegation planner and workflow inspection."
    first_surface_to_fix: "agent"
fixes:
  - path: "agents/agent-operating-model.md"
    change: "Added the First-Principles Execution Rule plus task-level clarification and delegation gates."
    rationale: "This is the canonical owner of every run's operating behavior."
    fix_surface: "workflow"
  - path: "workflow/main-workflow.md"
    change: "Made qualifying multi-Agent dispatch explicit rather than plan-only, with project workspace and run-ledger paths separated."
    rationale: "The execution graph owns state transitions, dispatch timing, and durable evidence location."
    fix_surface: "workflow"
  - path: "scripts/plan_agent_delegation.py"
    change: "Added an observable execution decision and made self-improvement role selection depend on the goal instead of unconditionally adding UI work."
    rationale: "The control plane must expose the reason for the branch and avoid irrelevant delegation."
    fix_surface: "validator"
regression_updates:
  evals_added_or_updated:
    - "scripts/test_agent_delegation.py"
  validators_added_or_updated: []
versioning:
  previous_version: ""
  new_version: ""
  changelog_updated: false
sync:
  embedded_copies_checked: []
  embedded_copies_updated: []
  skipped_targets:
    - path: "plugins/pm-copilot"
      reason: "Validation will determine whether a distributable-copy update is required."
after:
  scorecard_report: "not_run"
  validation_pass_rate: null
  high_severity_failures:
    - "A delegated worker may occupy its configured 15-minute runtime timeout; interruption leaves a resumable ledger but no automatic caller-side progress stream."
decision:
  status: "improved"
  next_action: "Use the persisted task ledger to resume interrupted delegation; consider bounded caller-side progress reporting separately."
