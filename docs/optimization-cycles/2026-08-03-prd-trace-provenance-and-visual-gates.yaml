cycle_id: "2026-08-03-prd-trace-provenance-and-visual-gates"
date: "2026-08-03"
goal: "Prevent implemented-feature PRDs from bypassing visual evidence, canonical detail structure, or runtime provenance checks."
practice_source:
  source_type: "user_feedback_and_run_audit"
  source_run_id: "canvas-connection-visibility-prd-2026-08-03"
  observed_problem:
    - "A user-facing requirement passed with no visual coverage because the Agent reported an empty UI-surface inventory."
    - "A requirement-detail table added an unsupported 边界规则 row."
    - "The run log reported an old PM Copilot version despite a newly started session."
generalized_failures:
  - failure_code: "surface_inventory_bypass"
    reusable_rule: "Every implemented-feature requirement has exactly one visual decision, and the requirement body itself is evidence of a user-facing surface when the inventory is empty."
  - failure_code: "detail_schema_drift"
    reusable_rule: "Requirement-detail tables use only the canonical schema; behavioral constraints belong in canonical detail cells."
  - failure_code: "runtime_provenance_drift"
    reusable_rule: "Implemented-feature run-log version is read from the active runtime VERSION file, never inferred or copied from history."
  - failure_code: "language_flag_bypass"
    reusable_rule: "Output validation resolves its language from the run log when a command omits an explicit language flag."
canonical_changes:
  - path: "artifacts/prd-contract.md"
    change: "Define canonical requirement-detail fields and forbid ad-hoc rule rows."
    fix_surface: "artifact-contract"
  - path: "artifacts/trace-contract.md"
    change: "Define active-runtime version provenance for implemented-feature run logs."
    fix_surface: "trace-contract"
  - path: "scripts/validate_agent_trace.py"
    change: "Require complete visual decisions with rationale, detect user-facing requirement bodies, and validate runtime version provenance."
    fix_surface: "trace-validator"
  - path: "scripts/validate_outputs.py"
    change: "Reject non-canonical requirement-detail table rows and infer artifact language from run-log provenance."
    fix_surface: "artifact-validator"
regression_updates:
  validators_added_or_updated:
    - "scripts/test_prd_generation_integrity.py"
    - "scripts/test_prd_contract.py"
    - "scripts/test_prd_rule_consistency.py"
validation_commands:
  - "python3 scripts/test_prd_generation_integrity.py"
  - "python3 scripts/test_prd_contract.py"
  - "python3 scripts/test_prd_rule_consistency.py"
  - "python3 scripts/validate_runtime_routing.py"
  - "python3 scripts/validate_repo.py"
versioning:
  previous_version: "4.9.12"
  new_version: "4.9.13"
  changelog_updated: true
remote_push:
  status: "pending"
  target: "origin/main"
