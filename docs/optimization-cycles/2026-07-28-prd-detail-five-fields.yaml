practice_source:
  source_type: "user_feedback"
  source_name: "PRD detail template review"
  practice: "Use five merged requirement-detail fields"
  applicability: "Chinese PRD requirement-detail tables and inline flow diagrams"
  evidence: "The user specified a five-field detail structure, asked that exceptions be described in the main detail field, and required any flowchart above the detail table."
observed_corrections:
  - correction: "Requirement details separated flow, UI, and states into several fields, making exception behavior too detached from the core requirement."
    affected_artifact: "PRD requirement-detail table"
    evidence: "User requested 用户与场景、需求入口、需求详情、设计与交互、图示 and asked to merge exceptions into 需求详情."
    severity: "Medium"
generalized_failures:
  - failure_code: "prd_detail_behavior_fragmentation"
    generalized_symptom: "A PRD can hide user-visible boundary behavior when normal flow and exceptions are split into isolated template rows."
    host_specific_details_removed: true
    reusable_rule: "Use five fields for each requirement detail; describe normal flow, permissions, states, recovery, and exceptions together in 需求详情, and place optional flowcharts above the table."
input_cases:
  - eval_case: "Chinese PRD requirement detail with a conditional user-flow diagram"
    run_id: ""
    context_mode: "repo-backed"
    output_folder: ""
scenario_portfolio:
  context_mode: "repo-backed"
  product_type: "other"
  pm_task_type: "self_improvement"
  risk_profile: "operations"
  platform: "cross_platform"
  pm_user_maturity: "ai_product_manager"
artifact_expectations:
  prd: true
  ui_delivery: false
  tracking_plan: false
  dev_tasks: false
  launch_decision: false
  pre_clarification_only: false
generalization_boundary:
  reference_projects_are_fixtures: true
  host_specific_terms_allowed_only_in:
    - "outputs/<run-id>/"
    - "fixture-scoped eval case"
  host_specific_terms_must_not_enter:
    - "PM_COPILOT.md"
    - "workflow/"
    - "policies/"
    - "indexes/"
    - "agents/"
    - "skills/"
    - "templates/"
    - "tools/"
    - "artifacts/"
    - "guardrails/"
    - "docs/"
baseline:
  scorecard_report: "outputs/improvement-scorecard.json"
  validation_pass_rate: null
  high_severity_failures: []
results:
  generated_artifacts:
    - "docs/optimization-cycles/2026-07-28-prd-detail-five-fields.yaml"
  validation_commands:
    - "python3 scripts/test_prd_contract.py"
    - "python3 scripts/validate_runtime_routing.py"
    - "python3 scripts/validate_repo.py"
    - "python3 scripts/run_delivery_checks.py outputs/team-projects-prd-2026-07-28 --language zh"
    - "git diff --check"
  validation_reports:
    - "outputs/team-projects-prd-2026-07-28/tool-results/delivery-check-report.json"
  review_scores:
    delivery: null
    prd: null
    metrics_tracking: null
    ui_delivery: null
    delivery_review: null
failure_classification:
  - failure_code: "prd_detail_behavior_fragmentation"
    severity: "Medium"
    area: "PRD detail presentation"
    symptom: "Exception behavior was detached from the requirement's core product rules."
    evidence: "The user requested that most behavior, including exceptions, be described in 需求详情."
    first_surface_to_fix: "artifact contract"
fixes:
  - path: "artifacts/prd-contract.md, artifacts/artifact-contracts.md, agents/requirements-agent.md, skills/prd-writing/SKILL.md"
    change: "Defined five canonical detail fields and moved all user-visible boundary behavior into 需求详情."
    rationale: "The main requirement narrative remains coherent when its normal and exception paths are co-located."
    fix_surface: "contract"
  - path: "templates/prd-template.md, templates/implemented-feature-prd-template.md"
    change: "Replaced the old flow, interaction, and state rows with 需求入口、需求详情、设计与交互 and retained 图示."
    rationale: "Templates must render the agreed user-facing structure by default."
    fix_surface: "template"
  - path: "scripts/validate_outputs.py, scripts/test_prd_contract.py"
    change: "Validated the five required fields and updated the representative PRD fixture."
    rationale: "Regression coverage keeps future PRDs aligned with the standard detail table."
    fix_surface: "validator"
regression_updates:
  evals_added_or_updated:
    - "scripts/test_prd_contract.py missing_detail_field"
  validators_added_or_updated:
    - "scripts/validate_outputs.py"
versioning:
  previous_version: "4.2.4"
  new_version: "4.2.5"
  changelog_updated: true
sync:
  embedded_copies_checked:
    - "team-projects-prd-2026-07-28 output"
  embedded_copies_updated:
    - "team-projects-prd-2026-07-28 prd.md and prd.html"
  skipped_targets:
    - path: "other embedded copies"
      reason: "The user requested only the team-projects PRD example."
remote_push:
