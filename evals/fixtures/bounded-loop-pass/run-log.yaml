agent_strategy:
  task_mode: product_review
  autonomy_level: full-loop
  goal: Improve a launch review until it is useful and validated.
  success_criteria:
    - Review has no Critical or High findings.
    - The critical path is owned and testable.
  effort_budget: standard-loop
  selected_path:
    - Run evaluator-optimizer loop.
  final_delivery_contract:
    judgment_required: true

delegation_plan:
  active: false

resume_checkpoint:
  last_reliable_state: validated

termination_condition:
  status: complete
  evidence: Two iterations closed the High finding and validation passed.
  pm_usefulness: The PM has a validated recommendation and owned critical path.
  remaining_limitation: none

tool_plan:
  required_tools:
    - tool_id: control.agent_loop
      purpose: Decide whether another iteration is justified.
    - tool_id: validation.agent_trace
      purpose: Validate bounded Loop trace.

decision_record:
  - id: D1
    decision: Proceed after adding rollback ownership.
    owner: PM Orchestrator
    confidence: high
    evidence:
      - Review finding H1 is closed in iteration 2.
    alternatives_considered:
      - Launch without rollback ownership.
    tradeoff: One additional review iteration delays handoff but removes launch ambiguity.
    readiness_impact: launch

replan_triggers:
  - trigger: review_high_or_critical
    observed_at_state: review
    action_taken: Added rollback owner and reran validation.
    affected_artifacts:
      - launch review
    readiness_impact: launch

review_loop:
  iterations: 2
  critical_or_high_findings:
    - H1 rollback owner missing
  finding_closures:
    - finding: H1 rollback owner missing
      disposition: fixed
      evidence: Rollback owner and verification evidence were added and re-reviewed.
      owner: Release lead
      due_phase: before_launch
      rationale: ""
  unresolved_findings: []
  final_recommendation: proceed_with_controls

loop_policy:
  enabled: true
  loop_type: evaluator_optimizer
  disabled_reason: ""
  max_iterations: 3
  max_tool_calls: 10
  max_elapsed_minutes: 30
  max_consecutive_no_progress: 1
  min_progress_score_delta: 5
  stop_conditions:
    - success_criteria_met
    - no_progress
    - iteration_budget_exhausted
  human_checkpoint:
    required_after_iteration: 0
    status: not_required
    required_before_actions: []

loop_state:
  current_iteration: 2
  tool_calls_used: 4
  elapsed_minutes: 12
  consecutive_no_progress: 0
  last_progress_score: 90
  success_criteria_met: true

iteration_trace:
  - iteration: 1
    hypothesis: Review will expose the largest launch-readiness gap.
    planned_actions:
      - Run PM usefulness review.
    observations:
      - Rollback owner is missing.
    evidence_delta:
      - High finding H1 recorded.
    artifact_delta: []
    decision_delta:
      - Launch remains blocked pending rollback ownership.
    validation_delta: []
    review_findings:
      - H1 rollback owner missing.
    progress_score_before: 20
    progress_score_after: 55
    outcome: progress
    next_decision: continue
  - iteration: 2
    hypothesis: Adding ownership and evidence will close H1.
    planned_actions:
      - Add rollback owner and verification evidence.
      - Rerun review and trace validation.
    observations:
      - H1 is closed.
    evidence_delta:
      - Rollback owner confirmed.
    artifact_delta:
      - Launch review updated.
    decision_delta:
      - Recommendation changed to proceed with controls.
    validation_delta:
      - Review and trace validation passed.
    review_findings: []
    progress_score_before: 55
    progress_score_after: 90
    outcome: success
    next_decision: stop_success

loop_summary:
  iterations_completed: 2
  stop_reason: success
  final_progress_score: 90
  unresolved_items: []

memory_candidates:
  none: true

next_actions:
  launch:
    - Execute the approved rollback drill.

action_closure:
  critical_path:
    - action_id: A1
      action: Run the rollback drill.
      owner: Release lead
      due_phase: before_launch
      source_decision_ids: [D1]
      source_blocker_ids: []
      completion_evidence: Rollback drill report is approved.
      status: ready

readiness:
  prd_status: ready for review
  engineering_handoff_status: ready
  launch_status: ready
  engineering_blockers: []
  launch_blockers: []
