loop_policy:
  enabled: true
  loop_type: execution
  max_iterations: 4
  max_tool_calls: 12
  max_elapsed_minutes: 45
  max_consecutive_no_progress: 1
  min_progress_score_delta: 5
  human_checkpoint:
    required_after_iteration: 0
    status: not_required
loop_state:
  current_iteration: 1
  tool_calls_used: 3
  elapsed_minutes: 8
  consecutive_no_progress: 0
  last_progress_score: 35
  success_criteria_met: false
termination_condition:
  status: blocked
loop_summary:
  iterations_completed: 1
  stop_reason: blocked
  final_progress_score: 35
