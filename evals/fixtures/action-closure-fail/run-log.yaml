agent_strategy:
  task_mode: product_review
  autonomy_level: full-loop
  goal: Turn a product recommendation into an accountable critical path.
  success_criteria:
    - The selected decision has an owned and evidence-based next action.
  effort_budget: standard-loop
  selected_path:
    - Review the decision and validate action closure.
  final_delivery_contract:
    judgment_required: true

delegation_plan:
  active: false

resume_checkpoint:
  last_reliable_state: review_complete

termination_condition:
  status: blocked
  evidence: The recommendation is written.
  pm_usefulness: The recommendation sounds clear.
  remaining_limitation: none

tool_plan:
  required_tools:
    - tool_id: validation.agent_trace
      purpose: Validate accountable action closure.

decision_record:
  - id: D1
    decision: Proceed with the reviewed option.
    confidence: high
    evidence:
      - Review evidence supports the option.

replan_triggers:
  - trigger: other
    observed_at_state: review
    action_taken: No replan required.

review_loop:
  iterations: 1
  critical_or_high_findings: []
  finding_closures: []
  unresolved_findings:
    - Critical path owner remains unresolved.
  final_recommendation: blocked

loop_policy:
  enabled: false
  loop_type: direct
  disabled_reason: Single-pass negative action-closure fixture.
  max_iterations: 1
  max_tool_calls: 1
  max_elapsed_minutes: 5
  max_consecutive_no_progress: 1
  min_progress_score_delta: 1
  stop_conditions: [blocked]
  human_checkpoint:
    required_after_iteration: 0
    status: not_required
    required_before_actions: []

loop_state:
  current_iteration: 0
  tool_calls_used: 0
  elapsed_minutes: 0
  consecutive_no_progress: 0
  last_progress_score: 0
  success_criteria_met: false

iteration_trace: []

loop_summary:
  iterations_completed: 0
  stop_reason: not_applicable
  final_progress_score: 0
  unresolved_items:
    - Engineering feasibility is not confirmed.

memory_candidates:
  none: true

next_actions:
  product:
    - Align with engineering later.

action_closure:
  critical_path:
    - action_id: A1
      action: Align later.
      owner: ""
      due_phase: someday
      source_decision_ids: [UNKNOWN]
      source_blocker_ids: [B1]
      completion_evidence: ""
      status: ready

readiness:
  prd_status: ready for review
  engineering_handoff_status: ready
  launch_status: not applicable
  engineering_blockers:
    - id: B1
      blocker: Engineering feasibility is not confirmed.
      owner: Engineering lead
      required_confirmation: Feasibility note
  launch_blockers: []
