version: 1
updated: 2026-05-19
purpose: >
  Canonical PM Copilot tool capability registry. Agents use this file before
  drafting or delivery checks to decide which tools must run, which tools need
  setup, and how results must be recorded.

status_values:
  - available
  - setup_required
  - unavailable
  - skipped
  - external_runtime
  - not_applicable

capabilities:
  - id: repo_context.file_read
    category: context
    required_when: "Always before repo-backed or embedded drafting."
    command: "Agent-native file read and search tools"
    result_contract: artifacts/tool-result-contract.md
    records_to:
      - run-log.yaml:tools_used
      - run-log.yaml:context.files_loaded
    fallback: "Ask for context or continue only as brief-only/document-backed with explicit limitation."

  - id: repo_context.git_inspection
    category: context
    required_when: "Repo-backed or embedded mode."
    command: "git status --short; git rev-parse --short HEAD"
    result_contract: artifacts/tool-result-contract.md
    records_to:
      - run-log.yaml:context.host_project_root
      - run-log.yaml:pm_copilot_revision
    fallback: "Record git unavailable and continue with file-based context only."

  - id: repo_context.host_frontend_inventory
    category: context
    required_when: "Repo-backed UI delivery, especially when frontend source exists or source-level visual fidelity is requested."
    command: "python3 scripts/inspect_host_frontend.py --host <host-repo> --query '<requirement or target surface>' --pretty"
    result_contract: artifacts/tool-result-contract.md
    records_to:
      - run-log.yaml:host_frontend_inventory
      - run-log.yaml:style_evidence
      - run-log.yaml:ui_delivery_trace
    fallback: "Manually inspect host frontend files. If source files cannot be found, stop for the missing host path; if rendering is blocked, record the concrete blocker and mark standalone HTML as fidelity-limited. Do not treat 'only generate a prototype' as standalone HTML consent."

  - id: research.web_search
    category: research
    required_when: "Competitor, benchmark, pricing, policy, regulated, or source-backed claims are requested or materially affect scope."
    command: "Agent-native web search/browser tools"
    result_contract: artifacts/tool-result-contract.md
    records_to:
      - prd.md:research_and_reference_findings
      - run-log.yaml:tools_used
    fallback: "Remove source-backed claims or label them as assumptions with unavailable-source limitation."

  - id: external_integrations.catalog
    category: integration
    required_when: "External MCP servers, SaaS APIs, OAuth tools, automation connectors, paid UI generators, analytics platforms, databases, CRM/support systems, or advertising tools are requested or recommended."
    command: "python3 scripts/preflight_integrations.py --tier recommended"
    optional_command: "python3 scripts/preflight_integrations.py --tier recommended --check-remote"
    result_contract: artifacts/tool-result-contract.md
    records_to:
      - run-log.yaml:external_integrations
      - run-log.yaml:tool_preflight
    fallback: "Use local/manual fallback and mark the integration setup-required, blocked, or not applicable."

  - id: validation.repo
    category: validation
    required_when: "PM Copilot repository files are changed."
    command: "python3 scripts/validate_repo.py"
    result_contract: artifacts/tool-result-contract.md
    records_to:
      - run-log.yaml:validation_results
    fallback: "Do not claim repository integrity; record command failure and fix before release."

  - id: validation.outputs
    category: validation
    required_when: "A run folder contains prd.md, portable UI HTML, dev-tasks.yaml, or launch-decision.yaml."
    command: "python3 scripts/validate_outputs.py outputs/<run-id> --language <zh|en>"
    result_contract: artifacts/tool-result-contract.md
    records_to:
      - prd.md:validation_results
      - run-log.yaml:validation_results
    fallback: "Do not deliver as final; record failure and fix generated artifacts."

  - id: validation.visual
    category: validation
    required_when: "A portable UI review artifact is generated, or an existing host preview is inspected as evidence."
    command: "python3 scripts/validate_prototype_visual.py outputs/<run-id>"
    source_preview_command: "python3 scripts/validate_ui_preview.py <preview-url-or-file> --run-folder outputs/<run-id>"
    setup_command: "python3 scripts/setup_visual_validation.py"
    behavior: "When no --prototype is provided, validates every supported portable HTML file in the run folder. Existing host previews may be inspected with validate_ui_preview.py and recorded as read-only evidence under visual_validation."
    result_contract: artifacts/tool-result-contract.md
    records_to:
      - prd.md:validation_results
      - run-log.yaml:visual_validation
      - outputs/<run-id>/visual-review/visual-report.json
      - outputs/<run-id>/visual-review/source-preview-report.json
    fallback: "Run setup first. Record skipped only after setup failure, browser launch restriction, or user-declined installation."

  - id: ui_delivery.source_extract
    category: ui_delivery
    required_when: "A PM run needs a read-only extract of an already rendered existing UI region as evidence."
    command: "python3 scripts/extract_ui_region.py --target <preview-url-or-file> --selector '<css-selector>' --output outputs/<run-id>/prototype-<platform>.html --run-folder outputs/<run-id>"
    result_contract: artifacts/tool-result-contract.md
    records_to:
      - run-log.yaml:ui_delivery_trace.source_extract
      - run-log.yaml:visual_validation
      - outputs/<run-id>/visual-review/source-extract-report.json
    fallback: "Keep the existing rendered region as evidence, or generate a conceptual review artifact with an explicit limitation. Do not claim a proposed feature is source-derived or implemented."

  - id: validation.html
    category: validation
    required_when: "A portable UI HTML file is generated."
    command: "python3 scripts/run_delivery_checks.py outputs/<run-id>"
    optional_command: "tidy -errors -quiet -utf8 prototype-<platform>.html"
    result_contract: artifacts/tool-result-contract.md
    records_to:
      - run-log.yaml:validation_results
    fallback: "Use Python html.parser fallback and record tidy compatibility limits separately."

  - id: validation.delivery_orchestrator
    category: validation
    required_when: "Before final delivery or before scoring an iteration round."
    command: "python3 scripts/run_delivery_checks.py outputs/<run-id> --language <zh|en>"
    result_contract: artifacts/tool-result-contract.md
    records_to:
      - outputs/<run-id>/tool-results/delivery-check-report.json
      - run-log.yaml:validation_results
    fallback: "Run individual validation commands and record why the orchestrator could not run."

  - id: validation.agent_trace
    category: validation
    required_when: "Every final delivery, eval, and self-iteration run."
    command: "python3 scripts/validate_agent_trace.py outputs/<run-id>"
    result_contract: artifacts/tool-result-contract.md
    records_to:
      - run-log.yaml:validation_results
      - outputs/<run-id>/tool-results/delivery-check-report.json
    fallback: "Do not claim final delivery until the runtime trace is complete and valid."

  - id: control.agent_loop
    category: control
    required_when: "Every final delivery; enabled Loops receive continue or stop decisions and direct runs record not_applicable."
    command: "python3 scripts/evaluate_agent_loop.py outputs/<run-id>"
    result_contract: artifacts/tool-result-contract.md
    records_to:
      - run-log.yaml:loop_state
      - run-log.yaml:loop_summary
      - outputs/<run-id>/tool-results/delivery-check-report.json
    fallback: "Stop autonomous iteration and record needs_input, blocked, degraded, or failed. Do not continue an unbounded loop."

  - id: execution.agent_runtime
    category: execution
    required_when: "A full-loop or self-iteration run has independent specialist work and a ready local agent runtime."
    command: "python3 scripts/agent_runtime.py discover --json"
    optional_command: "python3 scripts/agent_runtime.py execute --provider auto --prompt-file <prompt-file> --cwd <workspace>; python3 scripts/agent_runtime.py loop --worker-prompt-file <prompt-file> --verify-prompt '<verifier scope>' --max-iterations 2"
    supported_runtimes:
      - Seawork
      - Codex CLI
      - Claude CLI
      - Qwen Code
      - Kimi Code
      - Qoder CLI
      - CodeBuddy Code
    discovery_only:
      - Trae
      - Baidu Comate
      - Cursor Agent
    result_contract: artifacts/tool-result-contract.md
    records_to:
      - run-log.yaml:delegation_plan
      - run-log.yaml:iteration_trace
    fallback: "Use one local agent and record the unavailable runtime or rejected adapter. Do not claim delegated execution."

  - id: execution.single_agent_auto
    category: execution
    required_when: "A selected local runtime must execute one bounded specialist task."
    command: "python3 scripts/agent_runtime.py discover --json"
    result_contract: artifacts/tool-result-contract.md
    records_to:
      - run-log.yaml:delegation_plan
    fallback: "Stop automatic execution when no active or safe model-family fallback is available."

  - id: execution.multi_agent_loop
    category: execution
    required_when: "A bounded worker/verifier loop is selected."
    command: "python3 scripts/agent_runtime.py discover --json"
    result_contract: artifacts/tool-result-contract.md
    records_to:
      - run-log.yaml:loop_state
      - run-log.yaml:iteration_trace
    fallback: "Use the single-Agent fallback and record that the Seawork daemon is unavailable."

  - id: control.agent_delegation_plan
    category: control
    required_when: "A request could benefit from two or more independent specialist outputs."
    command: "python3 scripts/plan_agent_delegation.py --request '<user request>'"
    result_contract: artifacts/tool-result-contract.md
    records_to:
      - run-log.yaml:delegation_plan
      - run-log.yaml:agent_transitions
    fallback: "Use a single-agent path only when the request is too small, blocked on clarification, or no independent evidence-producing task exists."

  - id: execution.agent_delegation
    category: execution
    required_when: "A delegation plan selects two or more independent specialist workers and an automatic runtime is available."
    command: "python3 scripts/run_agent_delegation.py --request '<user request>'"
    optional_command: "python3 scripts/run_agent_delegation.py --request '<user request>' --execute --output outputs/<run-id>/tool-results/agent-delegation.json"
    result_contract: artifacts/tool-result-contract.md
    records_to:
      - outputs/<run-id>/tool-results/agent-delegation.json
      - run-log.yaml:delegation_plan
      - run-log.yaml:collaboration_protocol
    fallback: "Preserve the generated plan, execute a single worker only when safe, and record the concrete unavailable runtime or blocked review stage."

  - id: analysis.agent_runs
    category: optimization
    required_when: "Self-iteration needs local historical PM Copilot run evidence from this repository or embedded copies."
    command: "python3 scripts/analyze_agent_run_evidence.py --json"
    json_command: "python3 scripts/analyze_agent_run_evidence.py --json --report outputs/agent-run-evidence-report.json"
    result_contract: artifacts/tool-result-contract.md
    records_to:
      - optimization cycle notes
      - outputs/agent-run-evidence-report.json
    fallback: "Manually inspect local outputs and record the sample limitations."

  - id: optimization.scorecard
    category: optimization
    required_when: "Self-iteration, benchmark loops, PM Copilot capability reviews, or release retrospectives."
    command: "python3 scripts/agent_improvement_scorecard.py"
    json_command: "python3 scripts/agent_improvement_scorecard.py --json --report outputs/improvement-scorecard.json"
    result_contract: artifacts/tool-result-contract.md
    records_to:
      - optimization cycle notes
      - outputs/improvement-scorecard.json
    fallback: "Manually summarize eval coverage, latest results, validation evidence, runtime outputs, failure severity, and next fixes."

  - id: handoff.dev_tasks
    category: handoff
    required_when: "The user asks for engineering handoff, issue planning, or development tasks."
    command: "Generate outputs/<run-id>/dev-tasks.yaml from artifacts/dev-task-contract.md"
    result_contract: artifacts/tool-result-contract.md
    records_to:
      - run-log.yaml:handoff_artifacts
      - outputs/<run-id>/dev-tasks.yaml
    fallback: "Keep implementation tasks in PRD only and mark handoff export unavailable."

  - id: launch.decision_support
    category: launch
    required_when: "The user asks for release readiness, go/no-go, or launch decision support."
    command: "Generate outputs/<run-id>/launch-decision.yaml from artifacts/launch-decision-contract.md"
    result_contract: artifacts/tool-result-contract.md
    records_to:
      - run-log.yaml:handoff_artifacts
      - outputs/<run-id>/launch-decision.yaml
    fallback: "Return review recommendation only; do not claim launch approval."

default_preflight:
  command: "python3 scripts/preflight_tools.py"
  strict_command: "python3 scripts/preflight_tools.py --strict"
  network_required_command: "python3 scripts/preflight_tools.py --check-network <url> --require-network --strict"
  external_integrations_command: "python3 scripts/preflight_integrations.py --tier recommended"
  required_before:
    - full-loop iteration
    - final delivery
    - embedded host evaluation
    - release of PM Copilot changes

default_delivery_check:
  command: "python3 scripts/run_delivery_checks.py outputs/<run-id> --language <zh|en>"
  report_path: "outputs/<run-id>/tool-results/delivery-check-report.json"
