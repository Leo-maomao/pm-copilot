<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PRD 管理器</title>
    <link rel="stylesheet" href="/app.css">
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="项目和 PRD 目录">
        <div class="brand">
          <img class="brand-mark" src="/logo.svg" alt="">
          <span class="brand-label">PRD 管理器</span>
          <span id="index-status" class="brand-status" aria-live="polite"></span>
          <button id="refresh-button" class="icon-button status-refresh" aria-label="刷新索引" title="刷新索引">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 0 0-15.5-6.4L3 8m0-5v5h5M3 12a9 9 0 0 0 15.5 6.4L21 16m0 5v-5h-5"/></svg>
          </button>
          <button id="sidebar-toggle" class="icon-button sidebar-toggle" aria-label="收起目录" title="收起目录">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14.5 6-6 6 6 6"/></svg>
          </button>
        </div>
        <nav id="tree" class="tree" aria-label="PRD 项目目录"></nav>
      </aside>
      <main class="main">
        <button id="menu-button" class="icon-button menu-button" aria-label="打开目录" title="打开目录">☰</button>
        <section id="empty-state" class="empty-state" aria-live="polite">
          <div class="empty-icon">⌕</div><h1>正在整理 PRD</h1><p>扫描完成后，项目与文档会显示在左侧。</p>
        </section>
        <iframe id="document-viewer" title="PRD 内容" hidden></iframe>
      </main>
    </div>
    <dialog id="search-dialog" aria-labelledby="search-title">
      <div class="search-head"><h2 id="search-title">搜索 PRD</h2></div>
      <div class="search-box"><svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="5.5"/><path d="m15 15 4.5 4.5"/></svg><input id="search-input" type="text" autocomplete="off" placeholder="搜索 PRD 名称和正文" aria-label="搜索关键词"><button id="clear-search" class="clear-search" aria-label="清空搜索" title="清空搜索" hidden>×</button></div>
      <div id="search-summary" class="search-summary"></div>
      <div id="search-results" class="search-results" role="listbox" aria-label="搜索结果"></div>
    </dialog>
    <script src="/app.js"></script>
  </body>
</html>
