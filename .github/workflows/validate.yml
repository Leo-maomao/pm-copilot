name: Validate PM Copilot

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python scripts
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -m py_compile scripts/*.py skills/skill-cleaner/scripts/skill_cleaner.py

      - name: Check tool preflight
        run: |
          python3 scripts/preflight_tools.py --json

      - name: Install document and visual validation runtimes
        run: |
          sudo apt-get update
          sudo apt-get install --yes pandoc
          python3 -m pip install -r requirements-dev.txt
          python3 -m playwright install --with-deps chromium
          pandoc --version

      - name: Validate repository
        run: |
          python3 scripts/validate_repo.py

      - name: Run Python regression suite
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Run browser visual smoke test
        run: |
          python3 scripts/validate_prototype_visual.py evals/visual-fixtures/prototype-smoke --no-auto-setup --viewport desktop=1440x960 --viewport narrow=390x844

      - name: Run PRD benchmark fixture
        run: |
          python3 scripts/evaluate_prd_benchmark.py --candidate-root evals/prd-benchmark/candidates

      - name: Test reflection and learning trace
        run: |
          python3 scripts/test_reflection_learning_trace.py
