name: Validate PM Copilot

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python scripts
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -m py_compile scripts/*.py skills/skill-cleaner/scripts/skill_cleaner.py

      - name: Check tool preflight
        run: |
          python3 scripts/preflight_tools.py --json

      - name: Validate repository
        run: |
          python3 scripts/validate_repo.py

      - name: Test bounded Agent Loop
        run: |
          python3 scripts/test_agent_loop.py

      - name: Test decision-first PRD contract
        run: |
          python3 scripts/test_prd_contract.py

      - name: Test PRD media rendering
        run: |
          python3 scripts/test_prd_media_rendering.py

      - name: Test reflection and learning trace
        run: |
          python3 scripts/test_reflection_learning_trace.py
